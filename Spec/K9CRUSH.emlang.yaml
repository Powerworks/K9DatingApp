# K9Crush Event Model — full board export to Emlang
#
# Source: eventmodelers board 1d0fbac8-4ede-4992-9559-726ea658da8e
#   (org 401d5851-7972-43a6-be5c-59d30f844b4c), exported read-only via the
#   eventmodelers API. Each of the board's 35 CHAPTER nodes (persona/process
#   timelines) is mapped to one Emlang slice below, grouped in the same six
#   contexts documented in K9CRUSH_EVENT_MODEL_SPEC.md.
#
# Element type mapping (eventmodelers -> Emlang):
#   SCREEN    -> t: (trigger)
#   COMMAND   -> c: (command)
#   EVENT     -> e: (event)
#   READMODEL -> v: (view)
#   (no x: exceptions used — this board has no SPEC_ERROR nodes; rejection/
#    failure outcomes such as "RSVP Blocked: Event Full" are modeled as
#    regular EVENT nodes, so they map to e: like any other event)
#
# Ordering within a chapter's steps: columns are walked left-to-right per the
# timeline's `columns` array; within a column, elements are ordered
# View -> Screen -> Command -> Event (a Read Model feeds the Screen that
# displays it, the Screen issues the Command, the Command produces the Event).
#
# Slice/test key sanitization rule: extract runs of [A-Za-z0-9] from the
# eventmodelers title, PascalCase each run, and concatenate — e.g.
# "The Would-Be Adopter" -> TheWouldBeAdopter, "RSVP Blocked: Event Full"
# -> RSVPBlockedEventFull. Applied identically to chapter titles (slice keys)
# and GWT scenario titles (test keys).
#
# Swimlane prefixes: every t:/c:/e:/v: element name below is prefixed
# "Actor/" (Emlang swimlane syntax, no trailing slash), taken from each
# chapter's `actor`-type timeline lane (meta.timelineData.rows). 30 chapters
# have one actor for their whole story. 4 chapters ("The Curious New Dog
# Owner", "The Window Shopper", "The Event Browser", "The Skeptical Parent")
# are labeled Guest -> Member because they contain the Sign-Up Initiated ->
# Confirmation Email Sent -> Profile Confirmed sub-flow partway through:
# elements in the column hosting Sign-Up Initiated and every column after it
# are prefixed Member; every column before that is prefixed Guest (boundary
# column index confirmed against live timelineData.columns order, not
# guessed). "The Gift-Shopper" is plain Guest throughout (guest-checkout
# only, via its own Guest Account Created step, never converts within the
# chapter). See the "Actor Taxonomy" section in K9CRUSH_EVENT_MODEL_SPEC.md.
#
# All 35 chapters have at least one GWT scenario column, so every slice below
# uses Extended Form (steps + tests) — none needed Direct Form.

