    steps:
    - v: Shelter Staff/Shelter Dog Listings
      props:
        dogListingId: dog_71
        name: Biscuit
        breed: Beagle mix
        ageInMonths: '24'
        status: Available | NotReadyYet | InFoster | PendingAdoption | Adopted
    - t: Shelter Staff/Dog Listings
    - t: Shelter Staff/Edit Listing
