    - t: Shelter Staff/Remove Listing
    - c: Shelter Staff/Remove Dog Listing
    - e: Shelter Staff/Dog Listing Removed
    - t: Shelter Staff/Add Listing
    - c: Shelter Staff/Add Dog Listing
    - e: Shelter Staff/Dog Listing Added
      props:
        status: NotReadyYet
    - t: Shelter Staff/Update Listing Status
    - c: Shelter Staff/Update Listing Status
      props:
        status: Available | NotReadyYet | InFoster | PendingAdoption
    - e: Shelter Staff/Listing Status Updated
    - t: Shelter Staff/Status Change Blocked
    - c: Shelter Staff/Update Listing Status
