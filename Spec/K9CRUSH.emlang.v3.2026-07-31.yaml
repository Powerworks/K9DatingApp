    tests:
      ShelterDogListings:
        then:
        - v: Shelter Staff/Shelter Dog Listings
      DogListingEdited:
        when:
        - c: Shelter Staff/Edit Dog Listing
        then:
        - e: Shelter Staff/Dog Listing Edited
      DogListingRemoved:
        when:
        - c: Shelter Staff/Remove Dog Listing
        then:
        - e: Shelter Staff/Dog Listing Removed
      DogListingAdded:
        when:
        - c: Shelter Staff/Add Dog Listing
        then:
