  # [BUILT, NEW - no v1 counterpart] Identity module. Covers three
  # foundational Identity slices none of the 35 original chapters ever
  # modeled, since they're platform plumbing rather than a member/shelter
  # journey: how an OwnerAccount document comes into existence and gets
  # verified at all (Supabase Auth owns signup/login/confirmation
  # directly per ADR-005 - Identity only reacts to Database Webhooks
  # after the fact), and how the very first Admin gets created (nothing
  # else in this codebase can grant OwnerRole.Admin - there is no
  # general-purpose AssignRole endpoint, deliberately, same as
  # OwnerRole.Shelter only ever being reachable via
  # ShelterAccountCreatedV1). BootstrapAdmin is a one-time self-promotion
  # (never a target-owner parameter) that permanently 409s for everyone
  # once any Admin exists - there is no way to reverse this or add a
  # second admin via the API.
  BootstrappingTheFirstAdmin:
    steps:
    - t: Guest/Supabase Signs Up A New User
    - e: Guest/Supabase User Created
    - c: Member/Provision Owner On Supabase Signup
    - e: Member/Owner Registered
    - e: Guest/Supabase Confirms User Email
    - c: Member/Verify Owner On Supabase Confirmation
    - e: Member/Owner Verified
    - t: Member/Bootstrap Admin
    - c: Member/Bootstrap Admin
    - e: Member/Promoted To Admin
    - t: Member/Bootstrap Blocked
    - e: 'Member/Bootstrap Blocked: Admin Already Exists'
    tests:
      OwnerRegistered:
        given:
        - e: Guest/Supabase User Created
        when:
        - c: Member/Provision Owner On Supabase Signup
        then:
        - e: Member/Owner Registered
      OwnerVerified:
        given:
        - e: Member/Owner Registered
        - e: Guest/Supabase Confirms User Email
        when:
        - c: Member/Verify Owner On Supabase Confirmation
        then:
        - e: Member/Owner Verified
      PromotedToAdminWhenNoAdminExistsYet:
        given:
        - e: Member/Owner Registered
        when:
        - c: Member/Bootstrap Admin
        then:
        - e: Member/Promoted To Admin
      BootstrapBlockedOnceAnAdminAlreadyExists:
        given:
        - e: Member/Promoted To Admin
        when:
        - c: Member/Bootstrap Admin
        then:
        - e: 'Member/Bootstrap Blocked: Admin Already Exists'
  # ============================================================
  # v3 scope extension below. Three chapters widening ShelterAdoption's
  # own lifecycle: a dog entering care by surrender rather than shelter
  # intake, a dog spending time in foster care before (or instead of)
  # direct listing, and the volunteer workforce that includes a dedicated
  # home-check role feeding into application review. Donation/sponsorship-
  # style flows are deliberately out of scope for this pass.
  # ============================================================
  # [BUILT] ShelterAdoption module extension (2026-07-22). A member
  # surrendering their OWN dog into a shelter's care - distinct from
  # TheWouldBeAdopter's applicant journey and from a shelter directly
  # adding a listing (TheShelterRescueOrgSigningUp/ShelterManagingListings).
  # Gated by Admin, same reviewer-role pattern as shelter-account
  # verification - this is a platform-level intake decision, not the
  # surrendering member's own action past the initial request. Accepting a
  # surrender is the bridge into the existing listing lifecycle: it
  # cascades into ShelterManagingListings' "Add Dog Listing" (status
  # starts NotReadyYet, same as any newly added listing) rather than
  # inventing a parallel listing-creation path - TemperamentNotes becomes
  # the new listing's Bio, HealthNotes stays on the surrender record only.
  # DEVIATION: "Accept Dog Surrender" needed a shelterAccountId prop added
  # (disclosed gap-fill, same class as Places' CreatePlaceListing) - the
  # yaml never specified which shelter receives the dog, but
  # DogListing.Create requires one; Admin picks the destination shelter
  # explicitly. "Submit Additional Surrender Details" and "Review
  # Surrender Request" carry no request body, matching
  # ShelterReviewsApplication's identically-shaped steps exactly (no
  # captured content beyond the reason text already on the request side).
  SurrenderingYourDog:
    steps:
    - t: Member/Surrender My Dog
    - c: Member/Request Dog Surrender
      props:
        dogName: Cooper
        breed: Terrier mix
        ageInMonths: '48'
        reasonForSurrender: Relocating for work, no longer able to care for him
        temperamentNotes: Gentle, a little shy with strangers
        healthNotes: Up to date on vaccinations, no known conditions
    - e: Member/Dog Surrender Requested
    - v: Admin/Surrender Review Queue
      props:
        surrenderId: surr_204
        dogName: Cooper
        ownerOwnerId: owner_61
        status: Requested
    - t: Admin/Surrender Review Queue
    - c: Admin/Review Surrender Request
    - e: Admin/Surrender Request Reviewed
    - t: Admin/Request Additional Surrender Details
    - c: Admin/Request Additional Surrender Details
      props:
        reason: Please confirm current vaccination records
    - e: Admin/Additional Surrender Details Requested
    - t: Member/Submit Additional Surrender Details
    - c: Member/Submit Additional Surrender Details
    - e: Member/Additional Surrender Details Submitted
    - t: Admin/Accept Dog Surrender
    - c: Admin/Accept Dog Surrender
    - e: Admin/Dog Surrender Accepted
      props:
        cascadedTo: ShelterManagingListings (Add Dog Listing, status NotReadyYet)
    - t: Admin/Decline Dog Surrender
    - c: Admin/Decline Dog Surrender
      props:
        reason: Outside current intake capacity
    - e: Admin/Dog Surrender Declined
    tests:
      DogSurrenderRequested:
        when:
        - c: Member/Request Dog Surrender
        then:
        - e: Member/Dog Surrender Requested
      SurrenderReviewQueue:
        given:
        - e: Member/Dog Surrender Requested
        then:
        - v: Admin/Surrender Review Queue
      SurrenderRequestReviewed:
        given:
        - e: Member/Dog Surrender Requested
        when:
        - c: Admin/Review Surrender Request
        then:
        - e: Admin/Surrender Request Reviewed
      AdditionalSurrenderDetailsRequested:
        given:
        - e: Admin/Surrender Request Reviewed
        when:
        - c: Admin/Request Additional Surrender Details
        then:
        - e: Admin/Additional Surrender Details Requested
      AdditionalSurrenderDetailsSubmitted:
        given:
        - e: Admin/Additional Surrender Details Requested
        when:
        - c: Member/Submit Additional Surrender Details
        then:
        - e: Member/Additional Surrender Details Submitted
      DogSurrenderAccepted:
        given:
        - e: Admin/Surrender Request Reviewed
        when:
        - c: Admin/Accept Dog Surrender
        then:
        - e: Admin/Dog Surrender Accepted
      DogSurrenderAcceptedAfterAdditionalDetails:
        given:
        - e: Member/Additional Surrender Details Submitted
        when:
        - c: Admin/Accept Dog Surrender
        then:
        - e: Admin/Dog Surrender Accepted
      DogSurrenderDeclined:
        given:
        - e: Admin/Surrender Request Reviewed
        when:
        - c: Admin/Decline Dog Surrender
        then:
        - e: Admin/Dog Surrender Declined
  # v3 ENRICHMENT: [PLANNED] "FullIntake" mode - a per-shelter alternative to
  # the [BUILT] flow above, discovered by comparing this chapter against the
  # eventmodelers board (1d0fbac8...), which already modeled a much more
  # elaborate real-world intake pipeline than this yaml's original
  # Request/Review/Accept-or-Decline shape. Rather than replace the [BUILT]
  # flow (working, tested, committed), this is additive: ShelterAccount
  # gains SurrenderIntakeMode (Simple | FullIntake, Simple = 0 default -
  # same safe-default convention as DogListing.Status.Available = 0, no
  # migration needed for existing shelters). Simple-mode shelters keep
  # today's behavior byte-for-byte: Request -> Review -> (optional
  # Additional Details loop) -> Accept (cascades straight into
  # ShelterManagingListings' Add Dog Listing) or Decline, nothing below
  # this comment applies to them. FullIntake-mode shelters take the exact
  # same path through Accept (the DogListing is still created immediately,
  # NotReadyYet, the same way) but "Dog Surrender Accepted" now also opens
  # an in-progress intake record instead of closing the request, and the
  # 9 Shelter Staff steps below become available. "List Dog For Adoption"
  # is deliberately NOT a new command - it's ShelterManagingListings'
  # existing "Update Listing Status" (-> Available), reused rather than
  # duplicated, same restraint as FosteringADog's "Convert Foster To
  # Adoption" reusing SubmitApplicationHandler. "Record Euthanasia
  # Outcome" cascades into ShelterManagingListings' existing "Remove Dog
  # Listing" (reason: euthanized) for the same reason - no new terminal
  # DogListingStatus value needed. A minimal "Configure Surrender Intake
  # Mode" step is included so the field is actually settable; a broader
  # per-shelter preferences/settings chapter (the user also floated staff
  # language preference) is explicitly out of scope here - deliberately
  # not generalized until a real second use case exists.
  SurrenderingYourDogFullIntake:
    steps:
    - t: Shelter Staff/Shelter Settings
    - c: Shelter Staff/Configure Surrender Intake Mode
      props:
        mode: Simple | FullIntake
    - e: Shelter Staff/Surrender Intake Mode Configured
      props:
        mode: Simple | FullIntake
    - t: Shelter Staff/Surrender Intake Pipeline
    - c: Shelter Staff/Add To Waiting List
      props:
        surrenderRequestId: srr_118
    - e: Shelter Staff/Added To Waiting List
      props:
        waitlistPosition: '4'
    - c: Shelter Staff/Schedule Intake Appointment
      props:
        surrenderRequestId: srr_118
        appointmentDate: '2026-08-05'
    - e: Shelter Staff/Intake Appointment Scheduled
      props:
        appointmentDate: '2026-08-05'
    - c: Shelter Staff/Complete Surrender Paperwork
      props:
        surrenderRequestId: srr_118
        legalTransferSigned: 'true'
        ownershipProofType: dog_licence
    - e: Shelter Staff/Surrender Paperwork Completed
      props:
        legalTransferSigned: 'true'
        ownershipProofType: dog_licence
    - c: Shelter Staff/Pay Surrender Fee
      props:
        surrenderRequestId: srr_118
        feeAmount: '150'
        feeWaived: 'false'
    - e: Shelter Staff/Surrender Fee Paid
      props:
        feeAmount: '150'
        feeWaived: 'false'
    - c: Shelter Staff/Perform Health Check
      props:
        surrenderRequestId: srr_118
        dogId: dog_71
        performedBy: staff_213
    - e: Shelter Staff/Health Check Completed
      props:
        vaccinesUpdated: 'true'
        microchipStatus: registered
        healthIssuesFound: 'false'
    - c: Shelter Staff/Perform Behavior Test
      props:
        surrenderRequestId: srr_118
        dogId: dog_71
        performedBy: staff_213
    - e: Shelter Staff/Behavior Test Completed
      props:
        suitableForRehoming: 'true'
        behaviorNotes: Friendly, no aggression observed
    - c: Shelter Staff/Finalize Ownership Transfer
      props:
        surrenderRequestId: srr_118
        dogId: dog_71
        shelterId: shelter_44
    - e: Shelter Staff/Ownership Transferred
      props:
        previousOwnerId: user_812
        transferredAt: '2026-07-15T10:00:00Z'
    - t: Shelter Staff/List Dog For Adoption
    - c: Shelter Staff/Update Listing Status
      props:
        status: Available
        cascadedFrom: SurrenderingYourDogFullIntake (Finalize Ownership Transfer)
    - e: Shelter Staff/Listing Status Updated
    - t: Shelter Staff/Flag For Outcome Review
    - c: Shelter Staff/Flag For Outcome Review
      props:
        dogId: dog_71
        reason: Failed behavior test, not suitable for rehoming
        flaggedBy: staff_213
    - e: Shelter Staff/Outcome Review Flagged
    - t: Shelter Staff/Record Euthanasia Outcome
    - c: Shelter Staff/Record Euthanasia Outcome
      props:
        dogId: dog_71
        reason: Untreatable illness, no safe placement available
        authorizedBy: veterinarian
    - e: Shelter Staff/Euthanasia Recorded
      props:
        cascadedTo: ShelterManagingListings (Remove Dog Listing, reason euthanized)
    tests:
      SurrenderIntakeModeConfigured:
        when:
        - c: Shelter Staff/Configure Surrender Intake Mode
        then:
        - e: Shelter Staff/Surrender Intake Mode Configured
      AddedToWaitingList:
        given:
        - e: Admin/Dog Surrender Accepted
        when:
        - c: Shelter Staff/Add To Waiting List
        then:
        - e: Shelter Staff/Added To Waiting List
      IntakeAppointmentScheduled:
        given:
        - e: Admin/Dog Surrender Accepted
        when:
        - c: Shelter Staff/Schedule Intake Appointment
        then:
        - e: Shelter Staff/Intake Appointment Scheduled
      SurrenderPaperworkCompleted:
        given:
        - e: Admin/Dog Surrender Accepted
        when:
        - c: Shelter Staff/Complete Surrender Paperwork
        then:
        - e: Shelter Staff/Surrender Paperwork Completed
      SurrenderFeePaid:
        given:
        - e: Admin/Dog Surrender Accepted
        when:
        - c: Shelter Staff/Pay Surrender Fee
        then:
        - e: Shelter Staff/Surrender Fee Paid
      HealthCheckCompleted:
        given:
        - e: Admin/Dog Surrender Accepted
        when:
        - c: Shelter Staff/Perform Health Check
        then:
        - e: Shelter Staff/Health Check Completed
      BehaviorTestCompleted:
        given:
        - e: Admin/Dog Surrender Accepted
        when:
        - c: Shelter Staff/Perform Behavior Test
        then:
        - e: Shelter Staff/Behavior Test Completed
      OwnershipTransferred:
        given:
        - e: Shelter Staff/Behavior Test Completed
        when:
        - c: Shelter Staff/Finalize Ownership Transfer
        then:
        - e: Shelter Staff/Ownership Transferred
      DogListedForAdoptionAfterIntake:
        given:
        - e: Shelter Staff/Ownership Transferred
        when:
        - c: Shelter Staff/Update Listing Status
        then:
        - e: Shelter Staff/Listing Status Updated
      OutcomeReviewFlagged:
        given:
        - e: Shelter Staff/Behavior Test Completed
        when:
        - c: Shelter Staff/Flag For Outcome Review
        then:
        - e: Shelter Staff/Outcome Review Flagged
      EuthanasiaRecorded:
        given:
        - e: Shelter Staff/Outcome Review Flagged
        when:
        - c: Shelter Staff/Record Euthanasia Outcome
        then:
        - e: Shelter Staff/Euthanasia Recorded
  # [BUILT] ShelterAdoption module extension (2026-07-22). A member (the
  # "Foster Caregiver" swimlane below) providing temporary care for a
  # shelter's dog. Foster placement is modeled as a status change on an
  # EXISTING DogListing (see ShelterManagingListings' v3 enrichment), not
  # a separate document - a listing moves InFoster and back to Available
  # (or straight to Adopted via foster-to-adopt) rather than a foster
  # placement owning its own parallel lifecycle. DogListing.
  # CurrentFosterCaregiverOwnerId (new field, not in this yaml as a prop
  # since it's implementation detail, not a modeled field anywhere)
  # tracks who's currently fostering - deliberately survives "Mark Foster
  # Dog Ready For Adoption" (status goes back to Available so other
  # applicants can apply too, but the caregiver is still fostering until
  # "End Foster Placement" resolves it either way). "Convert Foster To
  # Adoption" is NOT a separate command in code - it IS TheWouldBeAdopter's
  # "Submit Application", called by the current foster caregiver for the
  # dog they're fostering, no special-casing (see SubmitApplicationHandler's
  # own comment).
  # DEVIATION: "Place Dog In Foster" takes fosterApplicationId, not the
  # yaml's bare fosterCaregiverOwnerId - a disclosed traceability fix
  # (same event-modeling checklist pass that found DogListing.Status's
  # missing Adopted guard): nothing linked this step back to *which*
  # approved application authorized the caregiver. The handler derives
  # the caregiver's owner id from the loaded, Approved FosterApplication.
  # DEVIATION: UpdateListingStatusHandler (ShelterManagingListings) now
  # also rejects any manual status change while CurrentFosterCaregiverOwnerId
  # is set - a manual flip out of InFoster would otherwise leave that
  # field stale. Use "End Foster Placement" first.
  FosteringADog:
    steps:
    - t: Foster Caregiver/Foster Program
    - c: Foster Caregiver/Apply To Foster
      props:
        homeType: House | Apartment | Other
        hasGarden: 'true'
        hasOtherPets: 'false'
        availableFrom: '2026-08-01'
    - e: Foster Caregiver/Foster Application Submitted
    - v: Admin/Foster Applications Queue
      props:
        fosterApplicationId: foster_318
        applicantOwnerId: owner_77
        status: Submitted
    - t: Admin/Foster Applications Queue
    - c: Admin/Review Foster Application
    - e: Admin/Foster Application Reviewed
    - t: Admin/Approve Foster Caregiver
    - c: Admin/Approve Foster Caregiver
    - e: Admin/Foster Caregiver Approved
    - t: Admin/Reject Foster Application
    - c: Admin/Reject Foster Application
      props:
        reason: Home visit could not confirm a secure garden
    - e: Admin/Foster Application Rejected
    - t: Admin/Place Dog In Foster
    - c: Admin/Place Dog In Foster
      props:
        dogListingId: dog_71
        fosterApplicationId: foster_318
    - e: Admin/Dog Placed In Foster
      props:
        cascadedTo: ShelterManagingListings (Update Listing Status -> InFoster)
    - t: Foster Caregiver/Foster Dog Ready For Adoption
    - c: Admin/Mark Foster Dog Ready For Adoption
    - e: Admin/Foster Dog Marked Ready For Adoption
      props:
        cascadedTo: ShelterManagingListings (Update Listing Status -> Available)
    - t: Foster Caregiver/Adopt My Foster Dog
    - c: Foster Caregiver/Convert Foster To Adoption
    - e: Foster Caregiver/Foster Converted To Adoption
      props:
        cascadedTo: TheWouldBeAdopter (Submit Application)
    - t: Admin/End Foster Placement
    - c: Admin/End Foster Placement
      props:
        reason: MovedToNewFoster | ReturnedToShelter | AdoptedByFosterCaregiver
    - e: Admin/Foster Placement Ended
    tests:
      FosterApplicationSubmitted:
        when:
        - c: Foster Caregiver/Apply To Foster
        then:
        - e: Foster Caregiver/Foster Application Submitted
      FosterApplicationsQueue:
        given:
        - e: Foster Caregiver/Foster Application Submitted
        then:
        - v: Admin/Foster Applications Queue
      FosterApplicationReviewed:
        given:
        - e: Foster Caregiver/Foster Application Submitted
        when:
        - c: Admin/Review Foster Application
        then:
        - e: Admin/Foster Application Reviewed
      FosterCaregiverApproved:
        given:
        - e: Admin/Foster Application Reviewed
        when:
        - c: Admin/Approve Foster Caregiver
        then:
        - e: Admin/Foster Caregiver Approved
      FosterApplicationRejected:
        given:
        - e: Admin/Foster Application Reviewed
        when:
        - c: Admin/Reject Foster Application
        then:
        - e: Admin/Foster Application Rejected
      DogPlacedInFoster:
        given:
        - e: Admin/Foster Caregiver Approved
        when:
        - c: Admin/Place Dog In Foster
        then:
        - e: Admin/Dog Placed In Foster
      FosterDogMarkedReadyForAdoption:
        given:
        - e: Admin/Dog Placed In Foster
        when:
        - c: Admin/Mark Foster Dog Ready For Adoption
        then:
        - e: Admin/Foster Dog Marked Ready For Adoption
      FosterConvertedToAdoption:
        given:
        - e: Admin/Dog Placed In Foster
        when:
        - c: Foster Caregiver/Convert Foster To Adoption
        then:
        - e: Foster Caregiver/Foster Converted To Adoption
      FosterPlacementEnded:
        given:
        - e: Admin/Dog Placed In Foster
        when:
        - c: Admin/End Foster Placement
        then:
        - e: Admin/Foster Placement Ended
  # [PLANNED] ShelterAdoption module extension (or a new Community/
  # Operations module, if volunteer roles grow beyond home checks -
  # deliberately not decided yet, kept here alongside Foster/Surrender
  # since a home check's only real consumer today is ShelterReviewsApplication).
  # A Volunteer is a Member playing a role, not a new OwnerRole - approval
  # just marks them eligible to be assigned checks, same "role via
  # cross-module event, not a general AssignRole endpoint" restraint
  # already used for OwnerRole.Shelter/Admin elsewhere in this codebase.
  # Home Check is the concrete link back into ShelterReviewsApplication -
  # see that chapter's v3 enrichment note; deliberately advisory, not a
  # hard precondition on Approve/Reject.
  VolunteeringAndHomeChecks:
    steps:
    - t: Volunteer/Volunteer Program
    - c: Volunteer/Apply To Volunteer
      props:
        areasOfInterest: Transport | Fundraising | Events | Administration | HomeChecks | FosterSupport
    - e: Volunteer/Volunteer Application Submitted
    - v: Admin/Volunteer Applications Queue
      props:
        volunteerApplicationId: vol_552
        applicantOwnerId: owner_90
        areasOfInterest: HomeChecks
        status: Submitted
    - t: Admin/Volunteer Applications Queue
    - c: Admin/Review Volunteer Application
    - e: Admin/Volunteer Application Reviewed
    - t: Admin/Approve Volunteer
    - c: Admin/Approve Volunteer
    - e: Admin/Volunteer Approved
    - t: Admin/Reject Volunteer Application
    - c: Admin/Reject Volunteer Application
      props:
        reason: Outside our current coverage area
    - e: Admin/Volunteer Application Rejected
    - t: Admin/Request Home Check
    - c: Admin/Request Home Check
      props:
        applicationId: app_309
    - e: Admin/Home Check Requested
    - t: Volunteer/Home Check Assigned
    - c: Volunteer/Accept Home Check Assignment
    - e: Volunteer/Home Check Assignment Accepted
    - t: Volunteer/Submit Home Check Report
    - c: Volunteer/Submit Home Check Report
      props:
        outcome: Pass | Fail | NeedsFollowUp
        notes: Secure garden, calm household, good fit for a shy dog
    - e: Volunteer/Home Check Report Submitted
    tests:
      VolunteerApplicationSubmitted:
        when:
        - c: Volunteer/Apply To Volunteer
        then:
        - e: Volunteer/Volunteer Application Submitted
      VolunteerApplicationsQueue:
        given:
        - e: Volunteer/Volunteer Application Submitted
        then:
        - v: Admin/Volunteer Applications Queue
      VolunteerApplicationReviewed:
        given:
        - e: Volunteer/Volunteer Application Submitted
        when:
        - c: Admin/Review Volunteer Application
        then:
        - e: Admin/Volunteer Application Reviewed
      VolunteerApproved:
        given:
        - e: Admin/Volunteer Application Reviewed
        when:
        - c: Admin/Approve Volunteer
        then:
        - e: Admin/Volunteer Approved
      VolunteerApplicationRejected:
        given:
        - e: Admin/Volunteer Application Reviewed
        when:
        - c: Admin/Reject Volunteer Application
        then:
        - e: Admin/Volunteer Application Rejected
      HomeCheckRequested:
        given:
        - e: Shelter Staff/Application Reviewed
        when:
        - c: Admin/Request Home Check
        then:
        - e: Admin/Home Check Requested
      HomeCheckAssignmentAccepted:
        given:
        - e: Admin/Home Check Requested
        - e: Admin/Volunteer Approved
        when:
        - c: Volunteer/Accept Home Check Assignment
        then:
        - e: Volunteer/Home Check Assignment Accepted
      HomeCheckReportSubmitted:
        given:
        - e: Volunteer/Home Check Assignment Accepted
        when:
        - c: Volunteer/Submit Home Check Report
        then:
        - e: Volunteer/Home Check Report Submitted
  # ============================================================
  # Board-only additions below (added to the eventmodelers board
  # 2026-07-30, never before in this yaml). All [PLANNED], no code, no
  # field specs decided on the board itself - props intentionally omitted
  # below rather than invented, unlike this file's other [PLANNED]
  # chapters. See memory (scheduling-module-scope, donations-module-scope,
  # gdpr-sar-requirement) for the full design reasoning.
  # ============================================================
  # [PLANNED] New Scheduling module (chapter c28df10c-...). A single
  # generic, purpose-tagged Appointment concept (HomeCheck | FosterHandover
  # | SurrenderIntake, linking back to the source entity id) reused across
  # three automation entry points rather than three separate booking flows.
  # "System/Propose ... Appointment" steps below have no human actor on the
  # board (an AUTOMATION node, not a SCREEN) - each is triggered by an
  # existing event in another chapter, noted via `triggeredBy`. Actor
  # attribution for the shared downstream lifecycle (Confirm/Reschedule/
  # Complete/Cancel/No-Show) is a judgment call made while writing this
  # into the yaml (Shelter Staff runs the lifecycle, the counterparty can
  # request a reschedule) - not yet confirmed on the board itself.
  BookingAppointments:
    steps:
    - c: System/Propose Home Check Appointment
      props:
        triggeredBy: VolunteeringAndHomeChecks (Accept Home Check Assignment)
    - e: System/Home Check Appointment Proposed
    - c: System/Propose Foster Handover Appointment
      props:
        triggeredBy: FosteringADog (Place Dog In Foster)
    - e: System/Foster Handover Appointment Proposed
    - c: System/Propose Surrender Intake Appointment
      props:
        triggeredBy: SurrenderingYourDogFullIntake (Review Surrender Request)
    - e: System/Surrender Intake Appointment Proposed
    - v: Shelter Staff/Appointments Queue
    - v: Member/My Appointments
    - t: Shelter Staff/Confirm Appointment
    - c: Shelter Staff/Confirm Appointment
    - e: Shelter Staff/Appointment Confirmed
    - t: Member/Request Reschedule
    - c: Member/Request Reschedule
    - e: Member/Appointment Reschedule Requested
    - t: Shelter Staff/Reschedule Appointment
    - c: Shelter Staff/Reschedule Appointment
    - e: Shelter Staff/Appointment Rescheduled
    - t: Shelter Staff/Complete Appointment
    - c: Shelter Staff/Complete Appointment
    - e: Shelter Staff/Appointment Completed
    - t: Shelter Staff/Cancel Appointment
    - c: Shelter Staff/Cancel Appointment
    - e: Shelter Staff/Appointment Cancelled
    - t: Shelter Staff/Record Appointment No-Show
    - c: Shelter Staff/Record Appointment No-Show
    - e: Shelter Staff/Appointment No-Show Recorded
    tests:
      HomeCheckAppointmentProposed:
        when:
        - c: System/Propose Home Check Appointment
        then:
        - e: System/Home Check Appointment Proposed
      FosterHandoverAppointmentProposed:
        when:
        - c: System/Propose Foster Handover Appointment
        then:
        - e: System/Foster Handover Appointment Proposed
      SurrenderIntakeAppointmentProposed:
        when:
        - c: System/Propose Surrender Intake Appointment
        then:
        - e: System/Surrender Intake Appointment Proposed
      AppointmentConfirmed:
        given:
        - e: System/Home Check Appointment Proposed
        when:
        - c: Shelter Staff/Confirm Appointment
        then:
        - e: Shelter Staff/Appointment Confirmed
      AppointmentRescheduleRequested:
        given:
        - e: Shelter Staff/Appointment Confirmed
        when:
        - c: Member/Request Reschedule
        then:
        - e: Member/Appointment Reschedule Requested
      AppointmentRescheduled:
        given:
        - e: Member/Appointment Reschedule Requested
        when:
        - c: Shelter Staff/Reschedule Appointment
        then:
        - e: Shelter Staff/Appointment Rescheduled
      AppointmentCompleted:
        given:
        - e: Shelter Staff/Appointment Confirmed
        when:
        - c: Shelter Staff/Complete Appointment
        then:
        - e: Shelter Staff/Appointment Completed
      AppointmentCancelled:
        given:
        - e: Shelter Staff/Appointment Confirmed
        when:
        - c: Shelter Staff/Cancel Appointment
        then:
        - e: Shelter Staff/Appointment Cancelled
      AppointmentNoShowRecorded:
        given:
        - e: Shelter Staff/Appointment Confirmed
        when:
        - c: Shelter Staff/Record Appointment No-Show
        then:
        - e: Shelter Staff/Appointment No-Show Recorded
  # [PLANNED] Scheduling module, chapter B (252fff51-...). Deliberately kept
  # simple - no recurrence-template/auto-generation engine, just individual
  # shift instances Shelter Staff create directly. A recurrence engine was
  # considered and explicitly deferred, not an oversight.
  VolunteerShiftRoster:
    steps:
    - t: Shelter Staff/Create Shift
    - c: Shelter Staff/Create Shift
    - e: Shelter Staff/Shift Created
    - v: Volunteer/Open Shifts
    - t: Volunteer/Sign Up For Shift
    - c: Volunteer/Sign Up For Shift
    - e: Volunteer/Volunteer Signed Up For Shift
    - v: Shelter Staff/Shift Roster
    - t: Volunteer/Cancel Shift Signup
    - c: Volunteer/Cancel Shift Signup
    - e: Volunteer/Shift Signup Cancelled
    - t: Shelter Staff/Cancel Shift
    - c: Shelter Staff/Cancel Shift
    - e: Shelter Staff/Shift Cancelled
    tests:
      ShiftCreated:
        when:
        - c: Shelter Staff/Create Shift
        then:
        - e: Shelter Staff/Shift Created
      OpenShifts:
        given:
        - e: Shelter Staff/Shift Created
        then:
        - v: Volunteer/Open Shifts
      VolunteerSignedUpForShift:
        given:
        - e: Shelter Staff/Shift Created
        when:
        - c: Volunteer/Sign Up For Shift
        then:
        - e: Volunteer/Volunteer Signed Up For Shift
      ShiftRoster:
        given:
        - e: Volunteer/Volunteer Signed Up For Shift
        then:
        - v: Shelter Staff/Shift Roster
      ShiftSignupCancelled:
        given:
        - e: Volunteer/Volunteer Signed Up For Shift
        when:
        - c: Volunteer/Cancel Shift Signup
        then:
        - e: Volunteer/Shift Signup Cancelled
      ShiftCancelled:
        given:
        - e: Shelter Staff/Shift Created
        when:
        - c: Shelter Staff/Cancel Shift
        then:
        - e: Shelter Staff/Shift Cancelled
  # [PLANNED] New Donations module, chapter A (4bbee2ff-...). A shared
  # payment shape (Start Donation -> gateway processes it -> Payment
  # Succeeded/Payment Failed -> Donation Completed) with a recurring
  # branch on top. Guest checkout allowed (AskUserQuestion decision,
  # 2026-07-30) - no forced OwnerAccount signup, matching every reference
  # shelter site reviewed. "Complete Donation" and "Start Recurring
  # Subscription" are automations (System actor, no SCREEN on the board)
  # triggered by Payment Succeeded, not user-issued commands.
  MakingADonation:
    steps:
    - t: Guest/Make A Donation
    - c: Guest/Start Donation
      props:
        isRecurring: 'true'
    - e: Guest/Donation Started
    - c: System/Charge Payment
    - e: System/Payment Succeeded
    - c: System/Report Payment Failure
    - e: System/Payment Failed
    - c: System/Complete Donation
      props:
        triggeredBy: Payment Succeeded
    - e: System/Donation Completed
    - c: System/Start Recurring Subscription
      props:
        triggeredBy: Payment Succeeded, isRecurring true
    - e: System/Recurring Donation Subscription Started
    - v: Member/My Donations
    - v: Shelter Staff/Donations Received
    tests:
      DonationStarted:
        when:
        - c: Guest/Start Donation
        then:
        - e: Guest/Donation Started
      PaymentSucceeded:
        given:
        - e: Guest/Donation Started
        when:
        - c: System/Charge Payment
        then:
        - e: System/Payment Succeeded
      PaymentFailed:
        given:
        - e: Guest/Donation Started
        when:
        - c: System/Report Payment Failure
        then:
        - e: System/Payment Failed
      DonationCompleted:
        given:
        - e: System/Payment Succeeded
        when:
        - c: System/Complete Donation
        then:
        - e: System/Donation Completed
      RecurringDonationSubscriptionStarted:
        given:
        - e: System/Payment Succeeded
        when:
        - c: System/Start Recurring Subscription
        then:
        - e: System/Recurring Donation Subscription Started
  # [PLANNED] Donations module, chapter B (41afcec8-...). Reuses the same
  # Payment Succeeded/Payment Failed event names as MakingADonation's
  # cross-chapter trigger labels (same convention as BookingAppointments'
  # triggeredBy notes). Charge Recurring Donation's success feeds back into
  # MakingADonation's Complete Donation automation - not duplicated here.
  ManagingARecurringDonation:
    steps:
    - c: System/Charge Recurring Donation
      props:
        triggeredBy: Recurring Charge Due
    - e: System/Recurring Donation Charged
    - c: System/Report Recurring Payment Failure
      props:
        triggeredBy: Recurring Charge Due
    - e: System/Recurring Donation Charge Failed
    - c: System/Flag Recurring Payment Failed
      props:
        triggeredBy: Payment Failed
    - e: System/Recurring Payment Failed
    - t: Member/Cancel Recurring Donation
    - c: Member/Cancel Recurring Donation
    - e: Member/Recurring Donation Cancelled
    tests:
      RecurringDonationCharged:
        when:
        - c: System/Charge Recurring Donation
        then:
        - e: System/Recurring Donation Charged
      RecurringDonationChargeFailed:
        when:
        - c: System/Report Recurring Payment Failure
        then:
        - e: System/Recurring Donation Charge Failed
      RecurringPaymentFlaggedFailed:
        given:
        - e: System/Recurring Donation Charge Failed
        when:
        - c: System/Flag Recurring Payment Failed
        then:
        - e: System/Recurring Payment Failed
      RecurringDonationCancelled:
        when:
        - c: Member/Cancel Recurring Donation
        then:
        - e: Member/Recurring Donation Cancelled
  # [PLANNED] GDPR/SAR handling (scoped 2026-07-30, gap analysis done
  # 2026-07-24). Chapter A (ed0643fd-...): a tracked, deadline-bound SAR
  # process. "Approve Erasure Request" bridges into Identity's *existing*
  # "Request Account Deletion" command (reused, not duplicated). "Flag
  # Request Overdue" is an automation mirroring ShelterAdoption's existing
  # MarkApplicationStale time-based pattern. Access fulfillment is a manual
  # admin compile step for v1, not an automated per-module data-compilation
  # fan-out (deferred as unnecessary complexity, AskUserQuestion decision).
  HandlingDataSubjectRequests:
    steps:
    - t: Member/Submit Data Subject Request
    - c: Member/Submit Data Subject Request
      props:
        requestType: Access | Rectification | Erasure
    - e: Member/Data Subject Request Submitted
    - t: Admin/Log Data Subject Request
    - c: Admin/Log Data Subject Request
      props:
        requestType: Access | Rectification | Erasure
        channel: Email | Phone | Post
    - e: Admin/Data Subject Request Logged
    - v: Admin/Data Subject Requests Queue
    - t: Admin/Start Reviewing Request
    - c: Admin/Start Reviewing Request
    - e: Admin/Data Subject Request Review Started
    - t: Admin/Approve Erasure Request
    - c: Admin/Approve Erasure Request
    - e: Admin/Erasure Request Approved
    - c: System/Request Account Deletion
      props:
        triggeredBy: Erasure Request Approved
        crossReference: AccountProfileSettings (existing command, reused not duplicated)
    - e: System/Account Deletion Requested
    - t: Admin/Compile Data Export
    - c: Admin/Compile Data Export
    - e: Admin/Data Export Compiled
    - t: Admin/Apply Rectification
    - c: Admin/Apply Rectification
      props:
        crossReference: whichever existing per-module edit command covers the field
    - e: Admin/Rectification Applied
    - t: Admin/Fulfil Request
    - c: Admin/Fulfil Request
    - e: Admin/Data Subject Request Fulfilled
    - t: Admin/Reject Request
    - c: Admin/Reject Request
      props:
        reason: Unable to verify requester identity
    - e: Admin/Data Subject Request Rejected
    - c: System/Flag Request Overdue
      props:
        triggeredBy: same time-based pattern as ShelterAdoption's MarkApplicationStale
    - e: System/Data Subject Request Overdue Flagged
    tests:
      DataSubjectRequestSubmitted:
        when:
        - c: Member/Submit Data Subject Request
        then:
        - e: Member/Data Subject Request Submitted
      DataSubjectRequestLogged:
        when:
        - c: Admin/Log Data Subject Request
        then:
        - e: Admin/Data Subject Request Logged
      DataSubjectRequestsQueue:
        given:
        - e: Member/Data Subject Request Submitted
        then:
        - v: Admin/Data Subject Requests Queue
      DataSubjectRequestReviewStarted:
        given:
        - e: Member/Data Subject Request Submitted
        when:
        - c: Admin/Start Reviewing Request
        then:
        - e: Admin/Data Subject Request Review Started
      ErasureRequestApproved:
        given:
        - e: Admin/Data Subject Request Review Started
        when:
        - c: Admin/Approve Erasure Request
        then:
        - e: Admin/Erasure Request Approved
      AccountDeletionRequestedFromErasure:
        given:
        - e: Admin/Erasure Request Approved
        when:
        - c: System/Request Account Deletion
        then:
        - e: System/Account Deletion Requested
      DataExportCompiled:
        given:
        - e: Admin/Data Subject Request Review Started
        when:
        - c: Admin/Compile Data Export
        then:
        - e: Admin/Data Export Compiled
      RectificationApplied:
        given:
        - e: Admin/Data Subject Request Review Started
        when:
        - c: Admin/Apply Rectification
        then:
        - e: Admin/Rectification Applied
      DataSubjectRequestFulfilled:
        given:
        - e: Admin/Data Export Compiled
        when:
        - c: Admin/Fulfil Request
        then:
        - e: Admin/Data Subject Request Fulfilled
      DataSubjectRequestRejected:
        given:
        - e: Admin/Data Subject Request Review Started
        when:
        - c: Admin/Reject Request
        then:
        - e: Admin/Data Subject Request Rejected
      DataSubjectRequestOverdueFlagged:
        given:
        - e: Admin/Data Subject Request Logged
        when:
        - c: System/Flag Request Overdue
        then:
        - e: System/Data Subject Request Overdue Flagged
  # [PLANNED] GDPR/SAR handling, chapter B (20ad9318-...). All three columns
  # triggered by the same "Account Permanently Deleted" event (reusing that
  # exact title from AccountProfileSettings' existing grace-period deletion
  # column as the automation trigger label, same convention as
  # BookingAppointments' 3-purpose Propose Appointment triggers). The real
  # code gap this needs first: OwnerAccountPermanentlyDeletedV1 is
  # Identity-internal only today, never promoted to Identity.Contracts.
  ErasureCascade:
    steps:
    - c: System/Anonymize Application Data
      props:
        triggeredBy: Account Permanently Deleted
        module: ShelterAdoption
    - e: System/Application Data Anonymized
    - c: System/Purge Notification History
      props:
        triggeredBy: Account Permanently Deleted
        module: Notifications
    - e: System/Notification History Purged
    - c: System/Remove Owner's Media Assets
      props:
        triggeredBy: Account Permanently Deleted
        module: Media
    - e: System/Media Assets Removed
    tests:
      ApplicationDataAnonymized:
        when:
        - c: System/Anonymize Application Data
        then:
        - e: System/Application Data Anonymized
      NotificationHistoryPurged:
        when:
        - c: System/Purge Notification History
        then:
        - e: System/Notification History Purged
      MediaAssetsRemoved:
        when:
        - c: System/Remove Owner's Media Assets
        then:
        - e: System/Media Assets Removed
