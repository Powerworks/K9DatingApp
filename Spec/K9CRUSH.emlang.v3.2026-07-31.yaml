  # [BUILT] ShelterAdoption module. "View Dog Listings" is a direct
  # state-view query (GetShelterDogListingsHandler, ownership-gated),
  # not a separate command+event. "Add Dog Listing" is the exact same
  # command as TheShelterRescueOrgSigningUp's "Add First Dog Listing" -
  # see that chapter's note.
  # DEVIATION: "Cancel Applications For Removed Listing" and "Notify
  # Applicant Of Listing Change" are same-module AUTOMATIONS (ADR-028 -
  # they route through the shared k9crush.events exchange like any
  # cross-module event, there's no separate local-only pub/sub), not
  # further commands a Shelter Staff member issues - they fire on their
  # own once Dog Listing Removed/Edited happens. "Notify Applicants Of
  # Cancellation" is not a separate step either - CancelApplicationsForRemovedListing
  # cascades ApplicationCancelledV1 directly to Notifications, one per
  # affected applicant.
  # v3 ENRICHMENT: real DogListings have no Status field at all today -
  # "Update Listing Status" is a new manual command for Shelter Staff, but
  # the status also has automatic sources once FosteringADog exists
  # (Place/End a foster placement moves a listing to/from InFoster) and
  # once an application is approved (ShelterReviewsApplication moves it to
  # Adopted) - those two chapters cascade this same status change rather
  # than duplicating the transition logic.
  # v3 ENRICHMENT: "Update Listing Status" cannot set OR change away from
  # Adopted (guard added 2026-07-22 after an event-modeling checklist pass
  # flagged this chapter had no defined status transitions at all).
  # Adopted is a one-way door reachable only via ShelterReviewsApplication's
  # approval cascade above - never assertable by hand, and not editable
  # once reached. A "dog returned after adoption" flow, if this product
  # ever needs one, is a distinct not-yet-modeled chapter, not a side
  # effect of this manual override.
