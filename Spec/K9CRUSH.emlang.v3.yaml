  # instead - ShelterAdoption just withdraws open applications in the
  # background with no count ever surfaced to the member. The shelter-side
  # "Flag Active Listings" branch is also not built - the yaml doesn't
  # specify what happens to a shelter's listings after they're flagged,
  # so there's no clear slice to build. "Log In During Grace Period" is
  # exposed as an explicit RecoverAccount command the client calls right
  # after a successful Supabase login (Supabase fires no webhook on
