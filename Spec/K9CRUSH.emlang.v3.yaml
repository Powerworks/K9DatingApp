  # [BUILT] Media module. This is also the real entity behind Profiles'
  # AddDogProfile chapter's `mediaAssetId` - a caller calls Upload Media
  # here first, then passes the resulting id into AddDogProfilePhoto.
  # DEVIATION: "Reject Upload" -> "Upload Rejected: Invalid File" is not
  # a separate command - UploadMediaRequest's own IValidatableObject
  # checks the storage URL's file extension against the declared
  # mediaType (photo: .jpg/.jpeg/.png/.gif/.webp, video: .mp4/.mov/.webm)
  # and Wolverine.Http's DataAnnotations pipeline 400s it before
  # UploadMediaHandler ever runs - folded into the Upload Media step
  # below as its failure branch. This backend never touches raw file
  # bytes (Supabase Storage owns the actual upload, ADR-005/024), so this
  # is a disclosed simplification, not real content-type sniffing.
  # `cascadeDeletesEngagement` on Remove Media is accepted but unused -
  # no Engagement/comments/likes concept exists anywhere in this codebase
  # yet for it to cascade into.
  UploadShareRemovePhotosAndVideos:
    steps:
    - t: Member/Upload Media
    - c: Member/Upload Media
      props:
        mediaType: Photo | Video
        storageUrl: https://storage.example/photo.jpg
    - e: Member/Media Uploaded
    - e: 'Member/Upload Rejected: Invalid File'
      props:
        reason: extension does not match declared mediaType
    - t: Member/Share Media
    - c: Member/Share Media
      props:
        visibility: Public | FollowersOnly | SpecificPeople
        sharedWithOwnerIds: '[owner_12, owner_45]'
    - e: Member/Media Shared
    - t: Member/Remove Media
    - c: Member/Remove Media
      props:
        cascadeDeletesEngagement: 'true'
    - e: Member/Media Removed
    - c: Member/Report Media
    - e: Member/Content Flagged
    tests:
      MediaUploaded:
        when:
        - c: Member/Upload Media
        then:
        - e: Member/Media Uploaded
      UploadRejectedInvalidFile:
        when:
        - c: Member/Upload Media
        then:
        - e: 'Member/Upload Rejected: Invalid File'
      MediaShared:
        given:
        - e: Member/Media Uploaded
        when:
        - c: Member/Share Media
