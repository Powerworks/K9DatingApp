        - e: Admin/Dog Surrender Accepted
      DogSurrenderAcceptedAfterAdditionalDetails:
        given:
        - e: Member/Additional Surrender Details Submitted
        when:
        - c: Admin/Accept Dog Surrender
        then:
        - e: Admin/Dog Surrender Accepted
      DogSurrenderDeclined:
        given:
        - e: Admin/Surrender Request Reviewed
        when:
        - c: Admin/Decline Dog Surrender
        then:
        - e: Admin/Dog Surrender Declined
  # [PLANNED] ShelterAdoption module extension. A member (the "Foster
  # Caregiver" swimlane below) providing temporary care for a shelter's
  # dog. Foster placement is modeled as a status change on an EXISTING
  # DogListing (see ShelterManagingListings' v3 enrichment), not a
  # separate document - a listing moves InFoster and back to Available
  # (or straight to Adopted via foster-to-adopt) rather than a foster
  # placement owning its own parallel lifecycle. "Convert Foster To
  # Adoption" is a fast path into TheWouldBeAdopter's own Submit
  # Application - the foster caregiver still goes through a real
  # application, just one a reviewer can reasonably expect to approve
  # quickly given the dog is already living with them.
  FosteringADog:
    steps:
    - t: Foster Caregiver/Foster Program
    - c: Foster Caregiver/Apply To Foster
      props:
        homeType: House | Apartment | Other
        hasGarden: 'true'
        hasOtherPets: 'false'
        availableFrom: '2026-08-01'
    - e: Foster Caregiver/Foster Application Submitted
    - v: Admin/Foster Applications Queue
      props:
        fosterApplicationId: foster_318
        applicantOwnerId: owner_77
        status: Submitted
    - t: Admin/Foster Applications Queue
    - c: Admin/Review Foster Application
    - e: Admin/Foster Application Reviewed
    - t: Admin/Approve Foster Caregiver
    - c: Admin/Approve Foster Caregiver
    - e: Admin/Foster Caregiver Approved
    - t: Admin/Reject Foster Application
    - c: Admin/Reject Foster Application
      props:
        reason: Home visit could not confirm a secure garden
    - e: Admin/Foster Application Rejected
    - t: Admin/Place Dog In Foster
    - c: Admin/Place Dog In Foster
      props:
        dogListingId: dog_71
        fosterCaregiverOwnerId: owner_77
    - e: Admin/Dog Placed In Foster
      props:
        cascadedTo: ShelterManagingListings (Update Listing Status -> InFoster)
    - t: Foster Caregiver/Foster Dog Ready For Adoption
    - c: Admin/Mark Foster Dog Ready For Adoption
    - e: Admin/Foster Dog Marked Ready For Adoption
      props:
        cascadedTo: ShelterManagingListings (Update Listing Status -> Available)
    - t: Foster Caregiver/Adopt My Foster Dog
    - c: Foster Caregiver/Convert Foster To Adoption
    - e: Foster Caregiver/Foster Converted To Adoption
      props:
        cascadedTo: TheWouldBeAdopter (Submit Application)
    - t: Admin/End Foster Placement
    - c: Admin/End Foster Placement
      props:
        reason: MovedToNewFoster | ReturnedToShelter | AdoptedByFosterCaregiver
    - e: Admin/Foster Placement Ended
    tests:
      FosterApplicationSubmitted:
        when:
        - c: Foster Caregiver/Apply To Foster
        then:
        - e: Foster Caregiver/Foster Application Submitted
      FosterApplicationsQueue:
        given:
        - e: Foster Caregiver/Foster Application Submitted
        then:
        - v: Admin/Foster Applications Queue
      FosterApplicationReviewed:
        given:
        - e: Foster Caregiver/Foster Application Submitted
        when:
        - c: Admin/Review Foster Application
        then:
        - e: Admin/Foster Application Reviewed
      FosterCaregiverApproved:
        given:
        - e: Admin/Foster Application Reviewed
        when:
        - c: Admin/Approve Foster Caregiver
        then:
        - e: Admin/Foster Caregiver Approved
      FosterApplicationRejected:
        given:
        - e: Admin/Foster Application Reviewed
        when:
        - c: Admin/Reject Foster Application
        then:
        - e: Admin/Foster Application Rejected
      DogPlacedInFoster:
        given:
        - e: Admin/Foster Caregiver Approved
        when:
        - c: Admin/Place Dog In Foster
        then:
        - e: Admin/Dog Placed In Foster
      FosterDogMarkedReadyForAdoption:
        given:
        - e: Admin/Dog Placed In Foster
        when:
        - c: Admin/Mark Foster Dog Ready For Adoption
        then:
        - e: Admin/Foster Dog Marked Ready For Adoption
      FosterConvertedToAdoption:
        given:
        - e: Admin/Dog Placed In Foster
        when:
        - c: Foster Caregiver/Convert Foster To Adoption
        then:
        - e: Foster Caregiver/Foster Converted To Adoption
      FosterPlacementEnded:
        given:
        - e: Admin/Dog Placed In Foster
        when:
        - c: Admin/End Foster Placement
        then:
        - e: Admin/Foster Placement Ended
  # [PLANNED] ShelterAdoption module extension (or a new Community/
  # Operations module, if volunteer roles grow beyond home checks -
  # deliberately not decided yet, kept here alongside Foster/Surrender
  # since a home check's only real consumer today is ShelterReviewsApplication).
  # A Volunteer is a Member playing a role, not a new OwnerRole - approval
  # just marks them eligible to be assigned checks, same "role via
  # cross-module event, not a general AssignRole endpoint" restraint
  # already used for OwnerRole.Shelter/Admin elsewhere in this codebase.
  # Home Check is the concrete link back into ShelterReviewsApplication -
  # see that chapter's v3 enrichment note; deliberately advisory, not a
  # hard precondition on Approve/Reject.
  VolunteeringAndHomeChecks:
    steps:
    - t: Volunteer/Volunteer Program
    - c: Volunteer/Apply To Volunteer
      props:
        areasOfInterest: Transport | Fundraising | Events | Administration | HomeChecks | FosterSupport
    - e: Volunteer/Volunteer Application Submitted
    - v: Admin/Volunteer Applications Queue
      props:
        volunteerApplicationId: vol_552
        applicantOwnerId: owner_90
        areasOfInterest: HomeChecks
        status: Submitted
    - t: Admin/Volunteer Applications Queue
    - c: Admin/Review Volunteer Application
    - e: Admin/Volunteer Application Reviewed
    - t: Admin/Approve Volunteer
    - c: Admin/Approve Volunteer
    - e: Admin/Volunteer Approved
    - t: Admin/Reject Volunteer Application
    - c: Admin/Reject Volunteer Application
      props:
        reason: Outside our current coverage area
    - e: Admin/Volunteer Application Rejected
    - t: Admin/Request Home Check
    - c: Admin/Request Home Check
      props:
        applicationId: app_309
    - e: Admin/Home Check Requested
    - t: Volunteer/Home Check Assigned
    - c: Volunteer/Accept Home Check Assignment
    - e: Volunteer/Home Check Assignment Accepted
    - t: Volunteer/Submit Home Check Report
    - c: Volunteer/Submit Home Check Report
      props:
        outcome: Pass | Fail | NeedsFollowUp
        notes: Secure garden, calm household, good fit for a shy dog
    - e: Volunteer/Home Check Report Submitted
    tests:
      VolunteerApplicationSubmitted:
        when:
        - c: Volunteer/Apply To Volunteer
        then:
        - e: Volunteer/Volunteer Application Submitted
      VolunteerApplicationsQueue:
        given:
        - e: Volunteer/Volunteer Application Submitted
        then:
        - v: Admin/Volunteer Applications Queue
      VolunteerApplicationReviewed:
        given:
        - e: Volunteer/Volunteer Application Submitted
        when:
        - c: Admin/Review Volunteer Application
        then:
        - e: Admin/Volunteer Application Reviewed
      VolunteerApproved:
        given:
        - e: Admin/Volunteer Application Reviewed
        when:
        - c: Admin/Approve Volunteer
        then:
        - e: Admin/Volunteer Approved
      VolunteerApplicationRejected:
        given:
        - e: Admin/Volunteer Application Reviewed
        when:
        - c: Admin/Reject Volunteer Application
        then:
        - e: Admin/Volunteer Application Rejected
      HomeCheckRequested:
        given:
        - e: Shelter Staff/Application Reviewed
        when:
        - c: Admin/Request Home Check
        then:
        - e: Admin/Home Check Requested
      HomeCheckAssignmentAccepted:
        given:
        - e: Admin/Home Check Requested
        - e: Admin/Volunteer Approved
        when:
        - c: Volunteer/Accept Home Check Assignment
        then:
        - e: Volunteer/Home Check Assignment Accepted
      HomeCheckReportSubmitted:
        given:
        - e: Volunteer/Home Check Assignment Accepted
        when:
        - c: Volunteer/Submit Home Check Report
        then:
        - e: Volunteer/Home Check Report Submitted
