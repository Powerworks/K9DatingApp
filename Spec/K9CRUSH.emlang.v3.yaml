  # [BUILT] Moderation module. "Content Flagged" is shared across 5
  # chapters on the original board (this one, MessagingDirectGroup's
  # Report Message, ActivityFeed's Report Post, LeaveAReviewRestaurantOrDogPark's
  # Report Review, and Media's own Report Media which never had a named
  # chapter counterpart at all) - only Media (see
  # UploadShareRemovePhotosAndVideos) and Places (LeaveAReviewRestaurantOrDogPark)
  # actually produce it today; Chat/ActivityFeed's two remaining
  # producers don't exist as real slices yet, so the queue only ever
  # shows Media/Review content.
  # DEVIATION: Suspend/Ban are gated by the yaml's OWN preconditions
  # (Suspend needs a prior Warn, Ban needs a prior Warn AND Suspend) -
  # confirmed those preconditions are real 409-Conflict guards in code,
  # not just illustrative GWT framing. Warn/Dismiss/RemoveContent have no
  # guard at all (valid from any status/state), also confirmed real.
  # Deliberately does NOT enforce Suspend/Ban anywhere - these are
  # recorded facts only (UserModerationRecord), never checked by any
  # authorization policy. Real platform-wide enforcement is a separate,
  # much larger, not-yet-built feature.
  ModeratingFlaggedContentUserReports:
    steps:
    - v: Admin/Moderation Queue
      props:
        flagId: flag_501
        contentType: Media | Review
        contentOwnerId: owner_44
        reporterOwnerId: owner_82
        status: Open
    - t: Admin/Moderation Queue
    - t: Admin/Flagged Content Detail
    - c: Admin/Dismiss Flag
    - e: Admin/Flag Dismissed
    - c: Admin/Remove Content
    - e: Admin/Content Removed
      props:
        cascadedTo: Media or Places (ContentRemovalRequestedV1)
    - c: Admin/Warn User
    - e: Admin/User Warned
      props:
        warningCount: '1'
    - c: Admin/Suspend User
    - e: Admin/User Suspended
    - c: Admin/Ban User
    - e: Admin/User Banned
    tests:
      QueueReflectsCurrentFlaggedContentAndReports:
        then:
        - v: Admin/Moderation Queue
      AdminDismissesAFlagWithNoActionNeeded:
        when:
        - c: Admin/Dismiss Flag
        then:
        - e: Admin/Flag Dismissed
      AdminRemovesContentThatViolatesPolicy:
        when:
        - c: Admin/Remove Content
        then:
        - e: Admin/Content Removed
      AdminWarnsAUserForAFirstViolation:
        when:
        - c: Admin/Warn User
        then:
        - e: Admin/User Warned
      RepeatOffenderSuspendedAfterAPriorWarning:
        given:
        - e: Admin/User Warned
        when:
        - c: Admin/Suspend User
        then:
        - e: Admin/User Suspended
      RepeatOffenderBannedAfterWarningAndSuspension:
        given:
        - e: Admin/User Warned
        - e: Admin/User Suspended
        when:
        - c: Admin/Ban User
        then:
        - e: Admin/User Banned
