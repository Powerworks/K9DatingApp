  # ============================================================
  # New chapters below - real, load-bearing slices built this session
  # that had no counterpart anywhere on the original 35-chapter board.
  # ============================================================
  # [BUILT, NEW - no v1 counterpart] Discovery module, event-sourced (one
  # Marten stream per unordered dog pair, MatchStream.IdFor(dogId1,dogId2)
  # - a deterministic hash of the sorted pair, so either dog swiping
  # first lands on the same stream). None of the 35 original board
  # chapters actually modeled the swipe mechanic itself, only its
  # downstream outcomes (TheWindowShopper's guest-side flows, various
  # chapters' "It's a Match!"/messaging-unlocked framing) - this chapter
  # fills that gap directly from the real implementation. Ownership-gated
  # (SwiperDogId must belong to the caller, verified against Discovery's
  # own DiscoveryFeedItem read-model, never a cross-module Domain
  # reference). UndoLastSwipe never touches match detection - it only
  # ever reverses the swipe itself, even if a match had already formed.
  # DetectMutualMatch is a same-module automation (Marten event
  # forwarding, not scheduled/HTTP-triggered) reacting to DogLiked -
  # cascades MatchCreatedV1 only on a genuinely NEW mutual match
  # (idempotency via live-aggregated state, not a persisted flag).
  SwipingAndMatching:
    steps:
    - t: Member/Discovery Feed
    - c: Member/Swipe On Dog
      props:
        swiperDogId: dog_12
        targetDogId: dog_71
        liked: 'true'
    - e: Member/Dog Liked
    - c: Member/Swipe On Dog
      props:
        liked: 'false'
    - e: Member/Dog Passed
    - t: Member/Undo Swipe
    - c: Member/Undo Last Swipe
    - e: Member/Swipe Undone
    - t: Member/No Swipe To Undo
    - e: 'Member/Undo Blocked: No Swipe To Undo'
    - c: Member/Detect Mutual Match
    - e: Member/Match Formed
      props:
        dogAId: dog_12
        dogBId: dog_71
    - e: Member/Match Created
      props:
        cascadedTo: Chat (CreateConversationOnMatch), Notifications (NotifyOnMatch)
    tests:
      DogLiked:
        when:
        - c: Member/Swipe On Dog
        then:
        - e: Member/Dog Liked
      DogPassed:
        when:
        - c: Member/Swipe On Dog
        then:
        - e: Member/Dog Passed
      SwipeUndone:
        given:
        - e: Member/Dog Liked
        when:
        - c: Member/Undo Last Swipe
        then:
        - e: Member/Swipe Undone
      UndoBlockedNoSwipeToUndo:
        when:
        - c: Member/Undo Last Swipe
        then:
        - e: 'Member/Undo Blocked: No Swipe To Undo'
      MatchFormedAndCreated:
        given:
        - e: Member/Dog Liked
        when:
        - c: Member/Detect Mutual Match
        then:
        - e: Member/Match Formed
        - e: Member/Match Created
  # [PARTIAL, NEW - no v1 counterpart] Chat module, event-sourced. Built
  # as REST-only + match-triggered, a deliberately narrower design than
  # v1's own MessagingDirectGroup chapter (kept unchanged, elsewhere in
  # this file) - see that chapter for the request/accept/group-chat
  # design that was NOT taken. A conversation is created automatically
  # (CreateConversationOnMatch, a cross-module automation reacting to
  # Discovery's MatchCreatedV1) the moment two
  # dogs mutually match - there is no message-request/accept step at all,
  # and the conversation's own stream id directly reuses Discovery's
  # MatchId (no second pair-hash derivation - MatchCreatedV1 already
  # provides a stable unique key for the pair). "Get My Conversations" was
  # a necessary addition beyond the docs' four named slices - without it
  # a caller has no way to discover a conversationId at all once a match
  # creates one asynchronously. No real-time push (SignalR) - a caller
  # polls GetMyConversations/GetConversationHistory. No group chat, no
  # manual "message anyone" flow, no Report Message -> Content Flagged
  # (Chat is one of the two still-missing "Content Flagged" producers,
  # alongside ActivityFeed - see ModeratingFlaggedContentUserReports'
  # note on this).
  ChatMatchTriggeredMessaging:
    steps:
    - e: Member/Match Created
    - c: Member/Create Conversation On Match
    - e: Member/Conversation Created
      props:
        conversationId: same as matchId
    - t: Member/My Conversations
    - v: Member/My Conversations
      props:
        conversationId: conv_88
        otherOwnerId: owner_44
    - t: Member/Conversation
    - v: Member/Conversation History
      props:
        conversationId: conv_88
        messages: '[{ senderOwnerId, text, sentAt }]'
    - c: Member/Send Message
      props:
        text: Hi! Would love to set up a playdate.
    - e: Member/Message Sent
    - c: Member/Mark As Read
      props:
        lastReadMessageId: msg_501
    - e: Member/Message Read
    tests:
      ConversationCreatedOnMatch:
        given:
        - e: Member/Match Created
        when:
        - c: Member/Create Conversation On Match
        then:
        - e: Member/Conversation Created
      ConversationCreationIsIdempotent:
        given:
        - e: Member/Conversation Created
        when:
        - c: Member/Create Conversation On Match
        then:
        - e: Member/Conversation Created
      MyConversations:
        given:
        - e: Member/Conversation Created
        then:
        - v: Member/My Conversations
      ConversationHistory:
        given:
        - e: Member/Conversation Created
        then:
        - v: Member/Conversation History
      MessageSent:
        given:
        - e: Member/Conversation Created
        when:
        - c: Member/Send Message
        then:
        - e: Member/Message Sent
      MessageRead:
        given:
        - e: Member/Message Sent
        when:
        - c: Member/Mark As Read
        then:
        - e: Member/Message Read
  # [BUILT, NEW - no v1 counterpart] Identity module. Covers three
  # foundational Identity slices none of the 35 original chapters ever
  # modeled, since they're platform plumbing rather than a member/shelter
  # journey: how an OwnerAccount document comes into existence and gets
  # verified at all (Supabase Auth owns signup/login/confirmation
  # directly per ADR-005 - Identity only reacts to Database Webhooks
  # after the fact), and how the very first Admin gets created (nothing
  # else in this codebase can grant OwnerRole.Admin - there is no
  # general-purpose AssignRole endpoint, deliberately, same as
  # OwnerRole.Shelter only ever being reachable via
  # ShelterAccountCreatedV1). BootstrapAdmin is a one-time self-promotion
  # (never a target-owner parameter) that permanently 409s for everyone
  # once any Admin exists - there is no way to reverse this or add a
  # second admin via the API.
  BootstrappingTheFirstAdmin:
    steps:
    - t: Guest/Supabase Signs Up A New User
    - e: Guest/Supabase User Created
    - c: Member/Provision Owner On Supabase Signup
    - e: Member/Owner Registered
    - e: Guest/Supabase Confirms User Email
    - c: Member/Verify Owner On Supabase Confirmation
    - e: Member/Owner Verified
    - t: Member/Bootstrap Admin
    - c: Member/Bootstrap Admin
    - e: Member/Promoted To Admin
    - t: Member/Bootstrap Blocked
    - e: 'Member/Bootstrap Blocked: Admin Already Exists'
    tests:
      OwnerRegistered:
        given:
        - e: Guest/Supabase User Created
        when:
        - c: Member/Provision Owner On Supabase Signup
        then:
        - e: Member/Owner Registered
      OwnerVerified:
        given:
        - e: Member/Owner Registered
        - e: Guest/Supabase Confirms User Email
        when:
        - c: Member/Verify Owner On Supabase Confirmation
        then:
        - e: Member/Owner Verified
      PromotedToAdminWhenNoAdminExistsYet:
        given:
        - e: Member/Owner Registered
        when:
        - c: Member/Bootstrap Admin
        then:
        - e: Member/Promoted To Admin
      BootstrapBlockedOnceAnAdminAlreadyExists:
        given:
        - e: Member/Promoted To Admin
        when:
        - c: Member/Bootstrap Admin
        then:
        - e: 'Member/Bootstrap Blocked: Admin Already Exists'
