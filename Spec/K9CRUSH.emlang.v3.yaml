  # [BUILT] Profiles module. Publishing cascades DogProfileCreatedV1 to
  # Discovery, which is the ONLY way a dog ever enters the swipe feed -
  # Drafts are never indexed (see the new SwipingAndMatching chapter).
  # DEVIATION: AddDogProfileDetails carries a `location` (latitude/
  # longitude) the yaml never listed as a prop - a disclosed gap-fill,
  # since Discovery's feed needs coordinates to do distance filtering and
  # nothing else in this chapter provides them.
  # DEVIATION: PublishDogProfile has a SECOND guard beyond "photo
  # required" - it also 409s if Location was never set (details never
  # added), which the yaml's own steps didn't anticipate since it never
  # modeled location as a prop in the first place.
  AddDogProfile:
    steps:
    - t: Member/Start Dog Profile
    - c: Member/Start Dog Profile
      props:
        maxDogProfiles: '10'
    - e: Member/Dog Profile Started
    - t: Member/Dog Details
    - c: Member/Add Dog Profile Details
      props:
        name: Biscuit
        breed: Labrador
        ageInMonths: '36'
        bio: Friendly
        location: '{ latitude: 45.5, longitude: -122.6 }'
    - e: Member/Dog Profile Details Added
    - t: Member/Add Photo
    - c: Member/Add Dog Profile Photo
      props:
        mediaAssetId: media_9f2a
    - e: Member/Dog Profile Photo Added
    - t: Member/Publish Profile
    - c: Member/Publish Dog Profile
    - e: Member/Dog Profile Published
    - t: Member/Photo Required
    - e: 'Member/Publish Blocked: Photo Required'
    - t: Member/Details Required
    - e: 'Member/Publish Blocked: Details Required'
      props:
        reason: location was never set
    tests:
      DogProfileStarted:
        when:
        - c: Member/Start Dog Profile
        then:
        - e: Member/Dog Profile Started
      DogProfileDetailsAdded:
        given:
        - e: Member/Dog Profile Started
        when:
        - c: Member/Add Dog Profile Details
        then:
        - e: Member/Dog Profile Details Added
      DogProfilePhotoAdded:
        given:
        - e: Member/Dog Profile Details Added
        when:
        - c: Member/Add Dog Profile Photo
        then:
        - e: Member/Dog Profile Photo Added
      DogProfilePublished:
        given:
        - e: Member/Dog Profile Photo Added
        when:
        - c: Member/Publish Dog Profile
        then:
        - e: Member/Dog Profile Published
      PublishBlockedPhotoRequired:
        given:
        - e: Member/Dog Profile Details Added
        when:
        - c: Member/Publish Dog Profile
        then:
        - e: 'Member/Publish Blocked: Photo Required'
      PublishBlockedDetailsRequired:
        given:
        - e: Member/Dog Profile Started
        when:
        - c: Member/Publish Dog Profile
        then:
        - e: 'Member/Publish Blocked: Details Required'
