# K9Crush Event Model — v3, extends v2 with a wider adoption-lifecycle scope
#
# Source: NOT a board export. v1 (K9CRUSH.emlang.yaml) was the original
# board export; v2 (K9CRUSH.emlang.v2.yaml) reverse-engineered the model
# from the real implementation as it stood at the time. v3 (this file) =
# v2 verbatim, PLUS a scope extension: four chapters modeling the fuller
# adoption-organization lifecycle that surrounds a shelter's own listings -
# an owner surrendering a dog into care, a dog spending time in foster
# care before being listed as available, and volunteers (including a
# dedicated home-check role feeding into application review). Two existing
# v2 chapters (TheWouldBeAdopter, ShelterManagingListings) are also
# enriched in place to connect to this wider scope (a fuller adoption
# intake questionnaire, and an explicit listing status that now has
# somewhere to come from other than "just added"). None of this new
# material is built yet - it is a scope proposal, not a record of what
# runs today. Donation/sponsorship-style flows are deliberately excluded
# from this pass.
#
# Purpose: re-import onto an eventmodelers board to plan the next phase of
# work.
#
# What changed vs v2, chapter by chapter:
#   - 15 chapters below are REWRITTEN to match the real implementation
#     (unchanged from v2 - see that file's own header for the v1->v2 diff).
#   - 20 chapters are byte-identical to v1/v2, in their original positions -
#     nothing has been built for them yet, so there is nothing to correct.
#   - 3 chapters are NEW as of v2 (no v1 equivalent) - real, built slices
#     that never had a home on the original board.
#   - 3 chapters are NEW as of v3 (no v1 or v2 equivalent) - a scope
#     extension, not yet built, appended in their own marked section at
#     the very end: SurrenderingYourDog, FosteringADog, and
#     VolunteeringAndHomeChecks (the last of which cross-references
#     ShelterReviewsApplication - a completed home check can gate
#     approval - via a `# v3 ENRICHMENT:` note on that existing chapter,
#     rather than duplicating its steps).
#   - 2 v2 chapters (TheWouldBeAdopter, ShelterManagingListings) are
#     ENRICHED in place - marked with their own `# v3 ENRICHMENT:` comment
#     at the point of change, distinct from v2's own `# DEVIATION:` comments
#     (which describe reality vs v1, not new v3 scope).
#
# Every deliberate deviation from v1's original narrative is called out
# with a `# DEVIATION:` comment at the point it occurs, so a board reviewer
# can see at a glance where and why reality diverged from the original
# design, rather than having to diff two large files. v3-only scope
# additions use `# v3 ENRICHMENT:` or `# v3 NEW:` instead, to keep "what's
# real" and "what's newly proposed" visually distinct at a glance.
#
# Chapter status key (each chapter is marked in its own leading comment,
# immediately above the slice key):
#   [BUILT]      - fully implemented and covered by automated tests
#   [PARTIAL]    - some of the chapter's steps are implemented, the rest
#                  deliberately deferred (reasons given inline)
#   [PLANNED]    - v3 scope extension, not built at all yet
#
# Element type mapping, ordering rules, and swimlane-prefix conventions are
# unchanged from v1 - see that file's header for the full explanation.

slices:
  TheCuriousNewDogOwner:
    steps:
    - t: Guest/Homepage
    - c: Guest/View Homepage
    - e: Guest/Homepage Viewed
    - t: Guest/Content Hub
    - c: Guest/View Content Hub
    - e: Guest/Content Hub Viewed
    - t: Guest/Reviews
    - c: Guest/View Reviews
    - e: Guest/Reviews Viewed
    - t: Guest/Full Benefits
    - c: Guest/View Full Benefits
    - e: Guest/Full Benefits Viewed
    - t: Guest/Sign-Up Incentive
    - c: Guest/Show Sign-Up Incentive
    - e: Guest/Sign-Up Incentive Shown
      props:
        incentiveMessage: Save your favorite spots and get alerts
    - t: Member/Sign Up
    - c: Member/Initiate Sign-Up
    - e: Member/Sign-Up Initiated
    - c: Member/Send Confirmation Email
    - e: Member/Confirmation Email Sent
    - t: Member/Confirm Profile
    - c: Member/Confirm Profile
    - e: Member/Profile Confirmed
    tests:
      HomepageViewed:
        when:
        - c: Guest/View Homepage
        then:
        - e: Guest/Homepage Viewed
      ContentHubViewed:
        given:
        - e: Guest/Homepage Viewed
        when:
        - c: Guest/View Content Hub
        then:
        - e: Guest/Content Hub Viewed
      ReviewsViewed:
        given:
        - e: Guest/Content Hub Viewed
        when:
        - c: Guest/View Reviews
        then:
        - e: Guest/Reviews Viewed
      FullBenefitsViewed:
        given:
        - e: Guest/Reviews Viewed
        when:
        - c: Guest/View Full Benefits
        then:
        - e: Guest/Full Benefits Viewed
      SignUpIncentiveShown:
        given:
        - e: Guest/Full Benefits Viewed
        when:
        - c: Guest/Show Sign-Up Incentive
        then:
        - e: Guest/Sign-Up Incentive Shown
      SignUpInitiated:
        given:
        - e: Guest/Sign-Up Incentive Shown
        when:
        - c: Member/Initiate Sign-Up
        then:
        - e: Member/Sign-Up Initiated
      ConfirmationEmailSent:
        given:
        - e: Member/Sign-Up Initiated
        when:
        - c: Member/Send Confirmation Email
        then:
        - e: Member/Confirmation Email Sent
      ProfileConfirmed:
        given:
        - e: Member/Confirmation Email Sent
        when:
        - c: Member/Confirm Profile
        then:
        - e: Member/Profile Confirmed
  # [PARTIAL] Discovery module. "Preview Nearby Dogs" is a direct state-view
  # query (GetDiscoveryFeedHandler, no [Authorize] - Guests browse too),
  # not a separate command+event pair - same "page-load command+event
  # collapses into the view itself" consolidation applied to every
  # read-model in this codebase.
  # DEVIATION: matchType is hardcoded "dog_to_dog" in the real response -
  # the "shelter_dog" variant (surfacing ShelterAdoption's DogListings in
  # this same feed) is an acknowledged, disclosed gap, not built.
  # DEVIATION: the Guest sign-up bridge (Initiate Sign-Up -> Confirmation
  # Email Sent -> Confirm Profile, plus v1's own "Prompt Sign-Up" screen)
  # is NOT implemented as commands in this codebase at all - Supabase
  # Auth owns the entire signup/login/confirmation lifecycle directly
  # (ADR-005); Identity only reacts after the fact via
  # ProvisionOwnerOnSupabaseSignup/VerifyOwnerOnSupabaseConfirmation
  # webhook automations (see the new BootstrappingTheFirstAdmin chapter).
  # Kept here as steps with no working command behind them, matching v1's
  # intent, since the screens are still real - only the commands are
  # external. "Reject Claim (Match No Longer Available)" is not a
  # separate command either - it's the Conflict branch of
  # ClaimSavedMatchHandler/FlagDogOfInterestHandler when the dog is no
  # longer in the feed, both calling the exact same DogOfInterest.Flag(...)
  # under the hood regardless of which of these two narrative entry
  # points triggered it.
  TheWindowShopper:
    steps:
    - v: Guest/Nearby Dogs Preview
      props:
        dogProfileId: dog_204
        name: Luna
        breed: Labrador
        distanceMiles: '1.2'
        matchType: dog_to_dog
    - t: Guest/Nearby Dogs
    - c: Guest/Block Match Attempt
      props:
        dogId: dog_482
    - e: Guest/Match Attempt Blocked
      props:
        dogId: dog_482
        reason: sign_up_required
    - t: Guest/Sign Up to Match
    - c: Member/Initiate Sign-Up
    - e: Member/Sign-Up Initiated
    - c: Member/Send Confirmation Email
    - e: Member/Confirmation Email Sent
    - t: Member/Confirm Profile
    - c: Member/Confirm Profile
    - e: Member/Profile Confirmed
    - t: Member/Saved Match
    - c: Member/Claim Saved Match
    - e: Member/Saved Match Claimed
      props:
        dogId: dog_482
    - c: Member/Flag Dog Of Interest
    - e: Member/Dog Of Interest Flagged
    - t: Member/Match No Longer Available
    - e: 'Member/Saved Match No Longer Available'
      props:
        reason: 'Saved Match No Longer Available.'
    tests:
      NearbyDogsPreview:
        then:
        - v: Guest/Nearby Dogs Preview
      MatchAttemptBlocked:
        when:
        - c: Guest/Block Match Attempt
        then:
        - e: Guest/Match Attempt Blocked
      SignUpInitiated:
        given:
        - e: Guest/Match Attempt Blocked
        when:
        - c: Member/Initiate Sign-Up
        then:
        - e: Member/Sign-Up Initiated
      ConfirmationEmailSent:
        given:
        - e: Member/Sign-Up Initiated
        when:
        - c: Member/Send Confirmation Email
        then:
        - e: Member/Confirmation Email Sent
      ProfileConfirmed:
        given:
        - e: Member/Confirmation Email Sent
        when:
        - c: Member/Confirm Profile
        then:
        - e: Member/Profile Confirmed
      SavedMatchClaimed:
        given:
        - e: Member/Profile Confirmed
        when:
        - c: Member/Claim Saved Match
        then:
        - e: Member/Saved Match Claimed
      DogOfInterestFlagged:
        given:
        - e: Member/Profile Confirmed
        when:
        - c: Member/Flag Dog Of Interest
        then:
        - e: Member/Dog Of Interest Flagged
      SavedMatchNoLongerAvailable:
        given:
        - e: Member/Profile Confirmed
        when:
        - c: Member/Claim Saved Match
        then:
        - e: 'Member/Saved Match No Longer Available'
  # [PARTIAL] ShelterAdoption module. Browse/Detail are direct state-view
  # queries (GetAdoptionListingsHandler/GetDogListingDetailsHandler, no
  # per-shelter filter - every DogListing across every active shelter),
  # not separate command+event pairs, same consolidation as everywhere
  # else. shelterName is deliberately NOT in the real response -
  # ShelterAccount.BusinessDetails is one free-text field
  # ("Sunny Paws Rescue, EIN 12-3456789"), not a clean display name;
  # fabricating one would be worse than just returning ShelterAccountId.
  # DEVIATION: v1's "Gate Application Start" (with a draftApplicationId
  # bridging prop) does not exist anywhere, real or external - dropped.
  # The real draft flow (see ResumingADraftApplication) is unconditional:
  # StartDraftApplicationHandler just creates a Draft, no gate.
  # DEVIATION: the sign-up bridge is external (Supabase, ADR-005) - see
  # TheWindowShopper's identical note, not repeated in full here.
  # DEVIATION: "Auto-Reject Application"/"Notify Applicant Of
  # Auto-Rejection" don't exist under those names - the real mechanism is
  # ShelterManagingListings' CancelApplicationsForRemovedListing automation
  # (DogListingRemovedV1 -> ApplicationCancelledV1 -> Notifications),
  # triggered by the SHELTER removing a listing, not by a "no longer
  # available" check at submission time. Dropped from here; see that
  # chapter instead.
  # v3 ENRICHMENT: "Submit Application" grows a full household/lifestyle
  # intake questionnaire (props below) - Application.Details today is one
  # free-text field, real enough to submit *something* but too thin to
  # actually screen an applicant on. The questionnaire below is answered
  # once and carried on the Application itself, not the Draft precursor -
  # ResumingADraftApplication's EditApplicationDetails is still where a
  # Draft's free-text Details field gets refined before submission; these
  # structured fields are asked at the point of submission. Feeds
  # ShelterReviewsApplication's review screen and, per
  # VolunteeringAndHomeChecks, can trigger a home-check request.
  TheWouldBeAdopter:
    steps:
    - v: Member/Adoption Listings
      props:
        dogListingId: dog_71
        name: Biscuit
        breed: Beagle mix
        shelterAccountId: shelter_9f2a
    - t: Member/Browse Listings
    - v: Member/Dog Profile
      props:
        dogListingId: dog_71
        name: Biscuit
        ageInMonths: '24'
        bio: Friendly, good with kids
    - t: Member/Dog Details
    - t: Member/Sign Up
    - c: Member/Initiate Sign-Up
    - e: Member/Sign-Up Initiated
    - c: Member/Send Confirmation Email
    - e: Member/Confirmation Email Sent
    - t: Member/Confirm Profile
    - c: Member/Confirm Profile
    - e: Member/Profile Confirmed
    - t: Member/Submit Application
    - c: Member/Submit Application
      props:
        maxOpenApplications: '3'
        householdSize: '3'
        homeOwnership: Own | Rent
        homeType: House | Apartment | Other
        hasGarden: 'true'
        gardenSize: Small | Medium | Large
        gardenEnclosed: 'true'
        hasChildren: 'false'
        childrenAgeRange: n/a
        hasOtherPets: 'false'
        otherPetsDetails: n/a
        dailyAloneHours: '4'
        hasUpcomingExtendedAbsence: 'false'
        preferredEnergyLevel: Low | Medium | High | NoPreference
        dailyExerciseCommitment: Two 30-minute walks
        pastDogOwnershipExperience: 'true'
        willingToCareForMedicalNeedsDog: 'false'
        willingToCareForNervousDog: 'true'
        dataProcessingConsent: 'true'
    - e: Member/Application Submitted
      props:
        wasDuplicate: 'false'
    - t: Member/Application Limit Reached
    - e: 'Member/Application Limit Reached'
      props:
        maxOpenApplications: '3'
    - c: Member/Resubmit Same Application
    - e: Member/Duplicate Submission Ignored
      props:
        wasDuplicate: 'true'
    tests:
      AdoptionListings:
        then:
        - v: Member/Adoption Listings
      DogProfile:
        then:
        - v: Member/Dog Profile
      SignUpInitiated:
        when:
        - c: Member/Initiate Sign-Up
        then:
        - e: Member/Sign-Up Initiated
      ConfirmationEmailSent:
        given:
        - e: Member/Sign-Up Initiated
        when:
        - c: Member/Send Confirmation Email
        then:
        - e: Member/Confirmation Email Sent
      ProfileConfirmed:
        given:
        - e: Member/Confirmation Email Sent
        when:
        - c: Member/Confirm Profile
        then:
        - e: Member/Profile Confirmed
      ApplicationSubmitted:
        given:
        - e: Member/Profile Confirmed
        when:
        - c: Member/Submit Application
        then:
        - e: Member/Application Submitted
      ApplicationLimitReached:
        given:
        - e: Member/Profile Confirmed
        when:
        - c: Member/Submit Application
        then:
        - e: 'Member/Application Limit Reached'
      DuplicateSubmissionIgnored:
        given:
        - e: Member/Application Submitted
        when:
        - c: Member/Resubmit Same Application
        then:
        - e: Member/Duplicate Submission Ignored
  # [BUILT] ShelterAdoption module. "Open Application Status Page" is a
  # direct state-view query (GetApplicationStatusHandler), not a separate
  # command+event, same consolidation as elsewhere. Ownership-gated
  # (Forbid if caller isn't the applicant) - not shown in v1 but a real
  # guard in the handler.
  # DEVIATION: WithdrawApplicationHandler's guard only blocks
  # Status==Approved specifically - every OTHER status (including
  # Pending/UnderReview/ReturnedForAlteration/Rejected/Stale/Closed/
  # Withdrawn itself) is allowed through, not just "not yet decided"
  # statuses as v1's status list might imply.
  CheckingApplicationStatus:
    steps:
    - v: Member/Application Status
      props:
        status: Pending | UnderReview | ReturnedForAlteration | Approved | Rejected | Withdrawn | Stale | Closed
    - t: Member/Application Status
    - t: Member/Withdraw Application
    - c: Member/Withdraw Application
    - e: Member/Application Withdrawn
    - t: Member/Can't Withdraw
    - e: 'Member/Withdrawal Blocked: Already Approved'
    tests:
      ApplicationStatus:
        then:
        - v: Member/Application Status
      ApplicationWithdrawn:
        when:
        - c: Member/Withdraw Application
        then:
        - e: Member/Application Withdrawn
      WithdrawalBlockedAlreadyApproved:
        given:
        - e: Shelter Staff/Application Approved
        when:
        - c: Member/Withdraw Application
        then:
        - e: 'Member/Withdrawal Blocked: Already Approved'
  # [BUILT] ShelterAdoption module (staleness automations use ADR-026
  # Wolverine scheduled messages, not a real-time scheduler service).
  # DEVIATION: "Submit Additional Details" is the APPLICANT's action, not
  # Shelter Staff's, despite the yaml's own swimlane label - it's the
  # applicant responding to the shelter's request, gated to
  # ApplicantOwnerId (VerifiedOwner policy), not the Shelter policy. Same
  # kind of narrative-vs-actual-actor departure already made once for
  # Identity's sign-up fragment.
  # DEVIATION: "Send Rejection Reason"/"Send Approval Notification" are
  # NOT separate commands - RejectApplication/ApproveApplication cascade
  # ApplicationRejectedV1/ApplicationApprovedV1 directly (an integration
  # event, not a further in-chapter command), consumed by the
  # Notifications module's own automations. Dropped from here.
  # v3 ENRICHMENT: see VolunteeringAndHomeChecks - a home check can be
  # requested against an UnderReview application (typically once it's
  # past the initial Review step) and its report becomes something a
  # reviewer weighs before Approve/Reject, the same way
  # RequestAdditionalDetails already gates progress on the applicant's
  # own response. Not modeled as a hard precondition here (unlike, say,
  # Approve requiring UnderReview) - a shelter can still decide either
  # way regardless of whether a check was requested; this is left as a
  # human judgment call, not a system-enforced gate.
  ShelterReviewsApplication:
    steps:
    - v: Shelter Staff/Pending Applications Queue
      props:
        applicationId: app_309
        dogListingId: dog_71
        applicantOwnerId: owner_44
        status: Pending
    - t: Shelter Staff/Applications Queue
    - t: Shelter Staff/Review Application
    - c: Shelter Staff/Review Application
    - e: Shelter Staff/Application Reviewed
    - t: Shelter Staff/Request Additional Details
    - c: Shelter Staff/Request Additional Details
      props:
        reason: Please provide vet references
    - e: Shelter Staff/Additional Details Requested
      props:
        staleAfterDays: '15'
    - c: Shelter Staff/Mark Application Stale
    - e: Shelter Staff/Application Marked Stale
      props:
        closesAfterDays: '30'
    - c: Shelter Staff/Close Stale Application
    - e: Shelter Staff/Application Closed
    - t: Member/Submit Additional Details
    - c: Member/Submit Additional Details
    - e: Member/Additional Details Submitted
    - t: Shelter Staff/Reject Application
    - c: Shelter Staff/Reject Application
      props:
        reason: Yard too small for this breed
    - e: Shelter Staff/Application Rejected
      props:
        rejectionReason: Yard too small for this breed
    - t: Shelter Staff/Approve Application
    - c: Shelter Staff/Approve Application
    - e: Shelter Staff/Application Approved
    tests:
      PendingApplicationsQueue:
        then:
        - v: Shelter Staff/Pending Applications Queue
      ApplicationReviewed:
        when:
        - c: Shelter Staff/Review Application
        then:
        - e: Shelter Staff/Application Reviewed
      AdditionalDetailsRequested:
        given:
        - e: Shelter Staff/Application Reviewed
        when:
        - c: Shelter Staff/Request Additional Details
        then:
        - e: Shelter Staff/Additional Details Requested
      ApplicationMarkedStale:
        given:
        - e: Shelter Staff/Additional Details Requested
        when:
        - c: Shelter Staff/Mark Application Stale
        then:
        - e: Shelter Staff/Application Marked Stale
      ApplicationClosed:
        given:
        - e: Shelter Staff/Application Marked Stale
        when:
        - c: Shelter Staff/Close Stale Application
        then:
        - e: Shelter Staff/Application Closed
      AdditionalDetailsSubmitted:
        given:
        - e: Shelter Staff/Additional Details Requested
        when:
        - c: Member/Submit Additional Details
        then:
        - e: Member/Additional Details Submitted
      ApplicationRejected:
        given:
        - e: Member/Additional Details Submitted
        when:
        - c: Shelter Staff/Reject Application
        then:
        - e: Shelter Staff/Application Rejected
      ApplicationApproved:
        given:
        - e: Member/Additional Details Submitted
        when:
        - c: Shelter Staff/Approve Application
        then:
        - e: Shelter Staff/Application Approved
  # [BUILT] ShelterAdoption module. "View Draft Applications" is a direct
  # state-view query (GetDraftApplicationsHandler, own-drafts-only, no
  # separate command+event), same consolidation as elsewhere - it
  # resolves each draft's dogName via a per-draft DogListing lookup
  # (N+1, deliberately not optimized - bounded by the 3-draft cap).
  # DEVIATION: v1 has no "start a draft" step at all, assuming drafts
  # just exist - the real entry point is StartDraftApplicationHandler
  # (added here as "Start Draft Application"), called from a dog listing's
  # detail page, distinct from Resume (reopening an existing one).
  # DEVIATION: "Check Dog Availability On Resume" is not a separate
  # command - ResumeDraftApplicationHandler itself checks the DogListing
  # still exists and either leaves the draft as Draft or transitions it
  # to ClosedDogNoLongerAvailable, both in the same 200 response.
  ResumingADraftApplication:
    steps:
    - v: Member/Draft Applications
      props:
        maxDraftApplications: '3'
        applicationId: app_412
        dogName: Nova
        lastEditedAt: '2026-07-12'
    - t: Member/Draft Applications
    - t: Member/Start Draft Application
    - c: Member/Start Draft Application
    - e: Member/Draft Application Started
      props:
        wasExisting: 'false'
    - c: Member/Resume Draft Application
    - e: Member/Draft Application Resumed
      props:
        status: Draft
    - t: Member/Dog No Longer Available
    - e: 'Member/Draft Application Closed: Dog No Longer Available'
      props:
        status: ClosedDogNoLongerAvailable
    - c: Member/Edit Application Details
    - e: Member/Application Details Edited
    - c: Member/Submit Application
    - e: Member/Application Submitted
      props:
        wasDuplicate: 'false'
    tests:
      DraftApplications:
        then:
        - v: Member/Draft Applications
      DraftApplicationStarted:
        when:
        - c: Member/Start Draft Application
        then:
        - e: Member/Draft Application Started
      DraftApplicationResumed:
        given:
        - e: Member/Draft Application Started
        when:
        - c: Member/Resume Draft Application
        then:
        - e: Member/Draft Application Resumed
      DraftApplicationClosedDogNoLongerAvailable:
        given:
        - e: Member/Draft Application Started
        when:
        - c: Member/Resume Draft Application
        then:
        - e: 'Member/Draft Application Closed: Dog No Longer Available'
      ApplicationDetailsEdited:
        given:
        - e: Member/Draft Application Started
        when:
        - c: Member/Edit Application Details
        then:
        - e: Member/Application Details Edited
      ApplicationSubmitted:
        given:
        - e: Member/Application Details Edited
        when:
        - c: Member/Submit Application
        then:
        - e: Member/Application Submitted
  ClaimABusinessListing:
    steps:
    - t: Business Owner/Select Listing & Enter Contact Info
    - c: Business Owner/Request Listing Claim
    - e: Business Owner/Listing Claim Requested
    - t: Business Owner/Verification Pending
    - c: Business Owner/Send Claim Verification
    - e: Business Owner/Claim Verification Sent
    - c: Business Owner/Verify Claim
    - e: Business Owner/Claim Verified
    - t: Business Owner/Verification Issues
    - c: Business Owner/Flag Claim Verification Issues
    - e: Business Owner/Claim Verification Issues Found
    - c: Business Owner/Manually Approve Claim
    - e: Business Owner/Claim Manually Approved
    - c: Business Owner/Reject Claim
    - e: Business Owner/Claim Rejected
    - t: Business Owner/Claim Approved — Ownership Transferred
    - c: Business Owner/Transfer Listing Ownership
    - e: Business Owner/Listing Ownership Transferred
    tests:
      ClaimantSubmitsContactInfoForAnExistingListing:
        when:
        - c: Business Owner/Request Listing Claim
        then:
        - e: Business Owner/Listing Claim Requested
      VerificationCodeSentAfterClaimRequest:
        given:
        - e: Business Owner/Listing Claim Requested
        when:
        - c: Business Owner/Send Claim Verification
        then:
        - e: Business Owner/Claim Verification Sent
      ContactInfoMatchesClaimAutoVerified:
        given:
        - e: Business Owner/Listing Claim Requested
        - e: Business Owner/Claim Verification Sent
        when:
        - c: Business Owner/Verify Claim
        then:
        - e: Business Owner/Claim Verified
      ContactInfoDoesnTMatchFlaggedForManualReview:
        given:
        - e: Business Owner/Listing Claim Requested
        - e: Business Owner/Claim Verification Sent
        when:
        - c: Business Owner/Flag Claim Verification Issues
        then:
        - e: Business Owner/Claim Verification Issues Found
      AdminManuallyApprovesAFlaggedClaim:
        given:
        - e: Business Owner/Listing Claim Requested
        - e: Business Owner/Claim Verification Sent
        - e: Business Owner/Claim Verification Issues Found
        when:
        - c: Business Owner/Manually Approve Claim
        then:
        - e: Business Owner/Claim Manually Approved
      AdminRejectsAFlaggedClaimWithAReason:
        given:
        - e: Business Owner/Listing Claim Requested
        - e: Business Owner/Claim Verification Sent
        - e: Business Owner/Claim Verification Issues Found
        when:
        - c: Business Owner/Reject Claim
        then:
        - e: Business Owner/Claim Rejected
      OwnershipTransferredAfterAutoVerification:
        given:
        - e: Business Owner/Listing Claim Requested
        - e: Business Owner/Claim Verified
        when:
        - c: Business Owner/Transfer Listing Ownership
        then:
        - e: Business Owner/Listing Ownership Transferred
  ShopVendorApplication:
    steps:
    - t: Vendor/Sell in the Merch Store
    - c: Vendor/Start Vendor Application
    - e: Vendor/Vendor Application Started
    - t: Vendor/Business & Product Details
    - c: Vendor/Submit Application Details
    - e: Vendor/Application Details Submitted
    - t: Vendor/Upload Business Documents
    - c: Vendor/Submit Vendor Documents
    - e: Vendor/Vendor Documents Submitted
    - t: Vendor/Vendor Application Approved
    - c: Vendor/Approve Vendor Application
    - e: Vendor/Vendor Approved
    - t: Vendor/Vendor Application Rejected
    - c: Vendor/Reject Vendor Application
    - e: Vendor/Vendor Application Rejected
    tests:
      VendorStartsANewApplication:
        when:
        - c: Vendor/Start Vendor Application
        then:
        - e: Vendor/Vendor Application Started
