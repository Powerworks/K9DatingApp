name: CD

# Runs after CI succeeds on main (not on its own push/PR trigger - this
# avoids deploying a commit CI hasn't actually passed for). Builds the 3
# app images, pushes them to GHCR, then SSHes into the Hetzner MVP box
# (ADR-025) to pull and restart. See docs/03-solution-architecture.md
# section 7.1/7.3 for the target this implements.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}
  SOLUTION_DIR: code/K9Crush-scaffold/K9Crush

jobs:
  build-and-push:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push gateway
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.SOLUTION_DIR }}
          file: ${{ env.SOLUTION_DIR }}/deploy/docker/Gateway.Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/k9crush-gateway:${{ github.event.workflow_run.head_sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/k9crush-gateway:latest
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=gateway

      - name: Build and push api-host
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.SOLUTION_DIR }}
          file: ${{ env.SOLUTION_DIR }}/deploy/docker/ApiHost.Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/k9crush-api-host:${{ github.event.workflow_run.head_sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/k9crush-api-host:latest
          cache-from: type=gha,scope=api-host
          cache-to: type=gha,mode=max,scope=api-host

      - name: Build and push blazor-app
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.SOLUTION_DIR }}
          file: ${{ env.SOLUTION_DIR }}/deploy/docker/BlazorApp.Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/k9crush-blazor-app:${{ github.event.workflow_run.head_sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/k9crush-blazor-app:latest
          cache-from: type=gha,scope=blazor-app
          cache-to: type=gha,mode=max,scope=blazor-app

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    # GitHub Environment "production" - set this up with the 3 secrets
    # referenced below, and optionally a required reviewer for a manual
    # approval gate before anything touches the box. See PR/commit
    # description for the one-time VPS setup this assumes.
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # Keeps the box's copy of these two files in sync with what's in
      # git on every deploy - .env (with real secrets/DOMAIN) is created
      # once by hand on the box per .env.example and is deliberately not
      # touched here.
      - name: Copy compose files to the box
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          source: "${{ env.SOLUTION_DIR }}/deploy/compose/docker-compose.prod.yml,${{ env.SOLUTION_DIR }}/deploy/compose/Caddyfile"
          target: "~/k9crush"
          strip_components: 5

      - name: Pull new images and restart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            set -e
            cd ~/k9crush
            export IMAGE_TAG=${{ needs.build-and-push.outputs.image-tag }}
            docker compose -f docker-compose.prod.yml --env-file .env pull gateway api-host blazor-app
            docker compose -f docker-compose.prod.yml --env-file .env up -d
            docker image prune -f
