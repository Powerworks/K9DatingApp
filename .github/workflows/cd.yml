name: CD

# Runs after CI succeeds on main (not on its own push/PR trigger - this
# avoids deploying a commit CI hasn't actually passed for). Cuts a semver
# release from Conventional Commits since the last one (if any commit
# since then warrants it), builds the 3 app images tagged with sha/latest/
# (optionally) that version, pushes to GHCR, then SSHes into the Hetzner
# MVP box (ADR-025) to pull and restart. See
# docs/03-solution-architecture.md section 7.1 for the target this
# implements.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}
  SOLUTION_DIR: code/K9Crush-scaffold/K9Crush

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      version: ${{ steps.semrel.outputs.new-release-version }}
      released: ${{ steps.semrel.outputs.new-release-published }}
    steps:
      # semantic-release needs full history/tags to diff against the last
      # release, not just the last commit - fetch-depth 0 is required here.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      # Reads .releaserc.json at repo root: commit-analyzer decides the
      # bump from Conventional Commits since the last vX.Y.Z tag (feat ->
      # minor, fix -> patch, "BREAKING CHANGE" footer -> major; docs/
      # chore/ci/build/refactor/test commits alone don't trigger a
      # release - that's expected, not a misconfiguration, and doesn't
      # fail the job). When it does release, pushes the git tag and
      # publishes a GitHub Release with generated notes.
      - name: Semantic Release
        id: semrel
        uses: cycjimmy/semantic-release-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-push:
    needs: release
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One metadata block per image: always tags with the commit sha and
      # `latest`, plus the semver from the release job - but only when
      # that job actually cut a release (`enable=` drops the line
      # otherwise, rather than pushing a blank/invalid tag).
      - name: Docker metadata - gateway
        id: meta-gateway
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/k9crush-gateway
          tags: |
            type=raw,value=${{ github.event.workflow_run.head_sha }}
            type=raw,value=latest
            type=raw,value=${{ needs.release.outputs.version }},enable=${{ needs.release.outputs.released == 'true' }}

      - name: Build and push gateway
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.SOLUTION_DIR }}
          file: ${{ env.SOLUTION_DIR }}/deploy/docker/Gateway.Dockerfile
          push: true
          tags: ${{ steps.meta-gateway.outputs.tags }}
          labels: ${{ steps.meta-gateway.outputs.labels }}
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=gateway

      - name: Docker metadata - api-host
        id: meta-api-host
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/k9crush-api-host
          tags: |
            type=raw,value=${{ github.event.workflow_run.head_sha }}
            type=raw,value=latest
            type=raw,value=${{ needs.release.outputs.version }},enable=${{ needs.release.outputs.released == 'true' }}

      - name: Build and push api-host
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.SOLUTION_DIR }}
          file: ${{ env.SOLUTION_DIR }}/deploy/docker/ApiHost.Dockerfile
          push: true
          tags: ${{ steps.meta-api-host.outputs.tags }}
          labels: ${{ steps.meta-api-host.outputs.labels }}
          cache-from: type=gha,scope=api-host
          cache-to: type=gha,mode=max,scope=api-host

      - name: Docker metadata - blazor-app
        id: meta-blazor-app
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/k9crush-blazor-app
          tags: |
            type=raw,value=${{ github.event.workflow_run.head_sha }}
            type=raw,value=latest
            type=raw,value=${{ needs.release.outputs.version }},enable=${{ needs.release.outputs.released == 'true' }}

      - name: Build and push blazor-app
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.SOLUTION_DIR }}
          file: ${{ env.SOLUTION_DIR }}/deploy/docker/BlazorApp.Dockerfile
          push: true
          tags: ${{ steps.meta-blazor-app.outputs.tags }}
          labels: ${{ steps.meta-blazor-app.outputs.labels }}
          cache-from: type=gha,scope=blazor-app
          cache-to: type=gha,mode=max,scope=blazor-app

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    # GitHub Environment "production" - set this up with the 3 secrets
    # referenced below, and optionally a required reviewer for a manual
    # approval gate before anything touches the box. See PR/commit
    # description for the one-time VPS setup this assumes.
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # Keeps the box's copy of these two files in sync with what's in
      # git on every deploy - .env (with real secrets/DOMAIN) is created
      # once by hand on the box per .env.example and is deliberately not
      # touched here.
      - name: Copy compose files to the box
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          source: "${{ env.SOLUTION_DIR }}/deploy/compose/docker-compose.prod.yml,${{ env.SOLUTION_DIR }}/deploy/compose/Caddyfile"
          target: "~/k9crush"
          strip_components: 5

      - name: Pull new images and restart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            set -e
            cd ~/k9crush
            export IMAGE_TAG=${{ needs.build-and-push.outputs.image-tag }}
            docker compose -f docker-compose.prod.yml --env-file .env pull gateway api-host blazor-app
            docker compose -f docker-compose.prod.yml --env-file .env up -d
            docker image prune -f
